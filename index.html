<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SDR-NODE // 废弃无线电接收终端</title>
    <style>
        :root {
            --green: #00ff66;
            --amber: #ffaa00;
            --red: #ff3333;
            --dim-green: rgba(0, 255, 102, 0.2);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body, html { width: 100%; height: 100%; background: #000; font-family: 'Courier New', 'Microsoft YaHei', sans-serif; overflow: hidden; }
        .viewport { position: relative; width: 100vw; height: 100vh; background: url('https://images.unsplash.com/photo-1518709268805-4e9042af9f23?q=80&w=2000&auto=format&fit=crop') center/cover no-repeat; display: flex; justify-content: center; align-items: center; filter: contrast(1.15) brightness(0.8); }
        .ambient-vignette { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: radial-gradient(circle, rgba(0,0,0,0.2) 20%, rgba(0,0,0,0.95) 100%); pointer-events: none; z-index: 1; }
        .screen-glow { position: absolute; width: 700px; height: 480px; background: rgba(0, 255, 102, 0.03); border-radius: 50%; filter: blur(100px); pointer-events: none; z-index: 2; transition: background 1s ease; }
        .crt-frame { position: relative; z-index: 10; width: 94%; max-width: 760px; background: rgba(4, 10, 6, 0.95); border: 2px solid var(--dim-green); border-radius: 12px; padding: 22px; box-shadow: 0 0 60px rgba(0, 0, 0, 0.95), inset 0 0 20px rgba(0, 255, 102, 0.08); backdrop-filter: blur(6px); }
        .crt-frame::after { content: " "; position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.35) 50%); background-size: 100% 4px; pointer-events: none; border-radius: 10px; }
        .screen-header { display: flex; justify-content: space-between; align-items: center; color: var(--green); font-size: 12px; border-bottom: 1px solid var(--dim-green); padding-bottom: 8px; margin-bottom: 12px; letter-spacing: 1px; text-shadow: 0 0 4px var(--green); }
        .header-tags span { background: rgba(0, 255, 102, 0.1); padding: 2px 6px; border-radius: 3px; font-size: 10px; margin-left: 4px; }
        #spectrumCanvas { width: 100%; height: 125px; background: #010502; border: 1px solid var(--dim-green); margin-bottom: 12px; display: block; border-radius: 4px; }
        .terminal-log { height: 170px; overflow-y: auto; color: var(--green); font-size: 13px; line-height: 1.6; word-break: break-all; margin-bottom: 12px; text-shadow: 0 0 4px rgba(0, 255, 102, 0.3); user-select: text; padding-right: 5px; }
        .terminal-log::-webkit-scrollbar { width: 4px; }
        .terminal-log::-webkit-scrollbar-thumb { background: var(--dim-green); border-radius: 2px; }
        .command-bar { display: flex; align-items: center; background: rgba(0, 0, 0, 0.85); border: 1px solid var(--dim-green); padding: 10px 12px; border-radius: 4px; }
        .prompt { color: var(--green); margin-right: 10px; font-size: 13px; font-weight: bold; }
        .cmd-input { background: transparent; border: none; outline: none; color: #fff; font-family: inherit; font-size: 13px; flex: 1; text-shadow: 0 0 6px var(--green); user-select: text; }
        .highlight-cn { color: #fff; font-weight: bold; background: rgba(255,255,255,0.15); padding: 0 4px; border-radius: 2px; }
        .warn-cn { color: var(--amber); font-weight: bold; }
        .success-cn { color: var(--green); font-weight: bold; }
        .danger-cn { color: var(--red); font-weight: bold; }
    </style>
</head>
<body>

<div class="viewport">
    <div class="ambient-vignette"></div>
    <div class="screen-glow" id="screenGlow"></div>
    <div class="crt-frame">
        <div class="screen-header">
            <div><b>废弃无线电监测站 // NODE-01</b><span class="header-tags"><span>短波RX</span><span>无网隔离</span></span></div>
            <span id="statusInd" class="warn-cn">系统待机中</span>
        </div>
        <canvas id="spectrumCanvas"></canvas>
        <div class="terminal-log" id="logBox">
            [电源管理] 应急电池接通。主板供电恢复正常。<br>
            [系统提示] 输入 <span class="highlight-cn">boot</span> 初始化终端系统...<br>
            ----------------------------------------------------------------------
        </div>
        <div class="command-bar">
            <span class="prompt">终端控制器:~#</span>
            <input type="text" class="cmd-input" id="cmdInput" autofocus autocomplete="off" spellcheck="false" placeholder="输入 boot 开始...">
        </div>
    </div>
</div>

<script>
    const canvas = document.getElementById('spectrumCanvas'), ctx = canvas.getContext('2d'), logBox = document.getElementById('logBox'), cmdInput = document.getElementById('cmdInput'), statusInd = document.getElementById('statusInd'), screenGlow = document.getElementById('screenGlow');
    let sysState = 0, filterActive = false, audioCtx = null, noiseGain = null;

    function resize() { canvas.width = canvas.offsetWidth; canvas.height = canvas.offsetHeight; }
    window.addEventListener('resize', resize); resize();

    // === 音频模块 (完美保留原汁原味的白噪声和机械三角波音) ===
    function initAudio() {
        if (audioCtx) return;
        try {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const buf = audioCtx.createBuffer(1, audioCtx.sampleRate * 2, audioCtx.sampleRate);
            const data = buf.getChannelData(0);
            for (let i = 0; i < data.length; i++) data[i] = Math.random() * 2 - 1;
            const noiseNode = audioCtx.createBufferSource(); noiseNode.buffer = buf; noiseNode.loop = true;
            noiseGain = audioCtx.createGain(); noiseGain.gain.value = 0.005;
            noiseNode.connect(noiseGain); noiseGain.connect(audioCtx.destination); noiseNode.start();
        } catch(e){}
    }

    function playKeySound() {
        if (!audioCtx) return;
        const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(140 + Math.random() * 60, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.012, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.04);
        osc.connect(gain); gain.connect(audioCtx.destination);
        osc.start(); osc.stop(audioCtx.currentTime + 0.04);
    }

    // === 核心渲染逻辑 ===
    function renderSpectrum() {
        ctx.fillStyle = "rgba(1, 5, 2, 0.22)"; ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.strokeStyle = "rgba(0, 255, 102, 0.08)"; ctx.lineWidth = 1;
        for (let x = 0; x < canvas.width; x += 30) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke(); }
        ctx.beginPath(); ctx.lineWidth = 1.5;
        ctx.strokeStyle = sysState === 4 ? "#ffaa00" : (sysState >= 2 ? "#00ff66" : "rgba(0, 255, 102, 0.2)");
        const slice = canvas.width / 90;
        for (let i = 0; i < 90; i++) {
            let amp = sysState === 1 ? Math.random() * 4 : (sysState === 2 ? Math.random() * 10 + 2 : (sysState === 3 ? Math.random() * 35 + 5 : (sysState === 4 ? (i > 32 && i < 58 ? Math.sin((i - 32) * 0.25) * 38 + Math.random() * 4 : Math.random() * 6) : 2)));
            let y = canvas.height / 2 + (Math.random() > 0.5 ? amp : -amp);
            if (i === 0) ctx.moveTo(i * slice, y); else ctx.lineTo(i * slice, y);
        }
        ctx.stroke();
        if (sysState === 4) { ctx.font = "bold 18px Courier New"; ctx.fillStyle = "#ffaa00"; ctx.fillText("【信号解调成功】 授权验证码：8912", canvas.width / 2 - 150, canvas.height / 2 + 6); }
        requestAnimationFrame(renderSpectrum);
    }
    renderSpectrum();

    function print(msg, customClass = '') { const div = document.createElement('div'); if (customClass) div.className = customClass; div.innerHTML = msg; logBox.appendChild(div); logBox.scrollTop = logBox.scrollHeight; }

    // === 核心指令控制 ===
    cmdInput.addEventListener('keydown', (e) => {
        initAudio(); playKeySound();
        if (e.key === 'Enter') {
            const val = cmdInput.value.trim(); cmdInput.value = '';
            if (!val) return;
            print(`终端控制器:~# ${val}`);
            const parts = val.split(' '), cmd = parts[0].toLowerCase(), param = parts[1] ? parts[1].toLowerCase() : '';

            if (cmd === 'boot') {
                if (sysState >= 1) return print(`[提示] 系统已经处于运行状态。`, 'warn-cn');
                sysState = 1; statusInd.innerText = "系统已启动 (天线离线)"; statusInd.className = "warn-cn"; screenGlow.style.background = "rgba(0, 255, 102, 0.1)";
                print(`[系统加载] 核心模块装载完毕...`, 'success-cn');
                setTimeout(() => print(`[警告] 外部天线未响应。请输入 <span class="highlight-cn">cat 硬件日志.log</span> 排查故障。`), 500);
            }
            else if (sysState === 0) { print(`[错误] 请先输入 <span class="highlight-cn">boot</span> 初始化系统。`, 'danger-cn'); }
            else if (cmd === 'ls') { print(`- 硬件日志.log<br>- 广播日志_1999.txt`); }
            else if (cmd === 'cat') {
                if (param.includes('硬件')) print(`【硬件诊断】天线处于离线状态。请输入 <span class="highlight-cn">enable-antenna</span> 激活天线。`, 'warn-cn');
                else if (param.includes('广播')) print(`【历史记录】目标频道：<span class="highlight-cn">4625 kHz</span>。若杂音大请输入 <span class="highlight-cn">filter on</span> 开启滤波。`);
                else print(`用法：cat 硬件日志.log 或 cat 广播日志_1999.txt`, 'danger-cn');
            }
            else if (cmd === 'enable-antenna') {
                if (sysState >= 2) return print(`[提示] 天线已在激活状态。`, 'warn-cn');
                sysState = 2; statusInd.innerText = "天线已激活 // 等待调频"; statusInd.className = "success-cn";
                print(`[硬件响应] 天线阵列已强行启动。请使用指令 <span class="highlight-cn">tune [频率]</span> 调频（例：tune 4625）。`, 'success-cn');
            }
            else if (cmd === 'tune') {
                if (sysState < 2) return print(`[错误] 请先输入 <span class="highlight-cn">enable-antenna</span> 激活天线。`, 'danger-cn');
                if (param === '4625') {
                    if (filterActive) { sysState = 4; statusInd.innerText = "信号锁定 // 4625 kHz"; statusInd.className = "warn-cn"; print(`[信号锁定] 观察上方示波器屏显浮现的验证码！`, 'success-cn'); }
                    else { sysState = 3; statusInd.innerText = "检测到信号 (重度干扰)"; statusInd.className = "danger-cn"; print(`[警告] 4625 kHz 干扰过强！请输入 <span class="highlight-cn">filter on</span> 开启滤波！`, 'warn-cn'); }
                } else print(`[TUNE ${param}] 一片死寂... (提示：cat 广播日志_1999.txt)`);
            }
            else if (cmd === 'filter' && param === 'on') {
                filterActive = true; print(`[滤波电路] 硬件降噪已开启。`, 'success-cn');
                if (sysState === 3) { sysState = 4; statusInd.innerText = "信号锁定 // 4625 kHz"; statusInd.className = "warn-cn"; print(`[信号解调完成] 示波器正高亮显示解调验证码！`, 'success-cn'); }
            }
            else if (cmd === 'auth' && param === '8912') { print(`[授权成功] 身份验证通过！正在跳转第二关...`, 'success-cn'); setTimeout(() => window.location.href = 'stage2.html', 1200); }
            else if (cmd === 'help') { print(`【指令】boot, ls, cat [文件], enable-antenna, tune [频率], filter on, auth [代码], clear`); }
            else if (cmd === 'clear') { logBox.innerHTML = ''; }
            else print(`未识别指令。输入 help 查看帮助。`, 'danger-cn');
        }
    });
    document.addEventListener('click', () => cmdInput.focus());
</script>
</body>
</html>
