<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TERMINAL // FORGOTTEN SDR-NODE</title>
    <style>
        :root {
            --green-glow: #00ff66;
            --amber-glow: #ffaa00;
        }

        * {
            box-sizing: border-box;
            margin: 0; padding: 0;
            user-select: none;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
            font-family: 'Courier New', Courier, monospace;
        }

        /* 1. 全屏沉浸式废弃电台背景图 */
        .viewport {
            position: relative;
            width: 100vw;
            height: 100vh;
            /* 高精拟真废弃防空洞/无线电台背景 */
            background: url('https://images.unsplash.com/photo-1518709268805-4e9042af9f23?q=80&w=2000&auto=format&fit=crop') center/cover no-repeat;
            display: flex;
            justify-content: center;
            align-items: center;
            filter: contrast(1.1) brightness(0.8);
        }

        /* 暗角与废弃防空洞环境滤镜 */
        .ambient-vignette {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle, rgba(0,0,0,0.2) 40%, rgba(0,0,0,0.92) 100%);
            pointer-events: none;
            z-index: 1;
        }

        /* 呼吸照明效果：模拟屏幕微光照亮废弃房间 */
        .screen-glow-environment {
            position: absolute;
            width: 600px;
            height: 400px;
            background: rgba(0, 255, 102, 0.08);
            border-radius: 50%;
            filter: blur(80px);
            pointer-events: none;
            z-index: 2;
            animation: pulse-glow 4s infinite alternate ease-in-out;
        }

        @keyframes pulse-glow {
            0% { opacity: 0.4; }
            100% { opacity: 0.8; }
        }

        /* 2. 嵌入在设备上的 CRT 显示屏 */
        .crt-hardware-frame {
            position: relative;
            z-index: 10;
            width: 90%;
            max-width: 640px;
            background: rgba(5, 12, 7, 0.88);
            border: 2px solid rgba(0, 255, 102, 0.25);
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 0 50px rgba(0, 0, 0, 0.95),
                        inset 0 0 15px rgba(0, 255, 102, 0.1);
            backdrop-filter: blur(4px);
        }

        /* CRT 动态扫描线与灰尘玻璃质感 */
        .crt-hardware-frame::after {
            content: " ";
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.35) 50%),
                        linear-gradient(90deg, rgba(255,0,0,0.03), rgba(0,255,0,0.01), rgba(0,0,255,0.03));
            background-size: 100% 4px, 6px 100%;
            pointer-events: none;
            border-radius: 10px;
        }

        /* 状态顶栏 */
        .screen-header {
            display: flex;
            justify-content: space-between;
            color: var(--green-glow);
            font-size: 11px;
            border-bottom: 1px solid rgba(0, 255, 102, 0.2);
            padding-bottom: 8px;
            margin-bottom: 12px;
            letter-spacing: 1px;
            text-shadow: 0 0 4px var(--green-glow);
        }

        /* Canvas 动态瀑布图/波形屏 */
        #waterfallCanvas {
            width: 100%;
            height: 90px;
            background: #020603;
            border: 1px solid rgba(0, 255, 102, 0.15);
            margin-bottom: 12px;
            display: block;
        }

        /* 终端日志打印区 */
        .terminal-log {
            height: 110px;
            overflow-y: auto;
            color: var(--green-glow);
            font-size: 12px;
            line-height: 1.5;
            word-break: break-all;
            margin-bottom: 10px;
            text-shadow: 0 0 4px rgba(0, 255, 102, 0.4);
            user-select: text;
        }

        /* 命令行输入框 */
        .command-bar {
            display: flex;
            align-items: center;
            background: rgba(0, 0, 0, 0.7);
            border: 1px solid rgba(0, 255, 102, 0.3);
            padding: 8px 10px;
            border-radius: 4px;
        }

        .prompt {
            color: var(--green-glow);
            margin-right: 8px;
            font-size: 13px;
        }

        .cmd-input {
            background: transparent;
            border: none;
            outline: none;
            color: #fff;
            font-family: inherit;
            font-size: 13px;
            flex: 1;
            text-shadow: 0 0 6px var(--green-glow);
            user-select: text;
        }

        @media (max-width: 480px) {
            .crt-hardware-frame { padding: 14px; width: 95%; }
            .terminal-log { height: 90px; font-size: 11px; }
            #waterfallCanvas { height: 70px; }
        }
    </style>
</head>
<body>

<div class="viewport">
    <div class="ambient-vignette"></div>
    <div class="screen-glow-environment"></div>

    <!-- 硬件显示屏主体 -->
    <div class="crt-hardware-frame">
        <div class="screen-header">
            <span>FORGOTTEN_NODE // RX-4625</span>
            <span id="statusIndicator">SYSTEM DORMANT</span>
        </div>

        <!-- 频谱瀑布波形图 -->
        <canvas id="waterfallCanvas"></canvas>

        <!-- 终端控制台日志 -->
        <div class="terminal-log" id="logBox">
[SYS_BOOT] Substation receiver power restored.<br>
[SYS_WARN] Main antenna misaligned. High static ratio.<br>
[SYS_HINT] Type 'help' to access console commands.<br>
--------------------------------------------------
        </div>

        <!-- 指令输入行 -->
        <div class="command-bar">
            <span class="prompt">&gt;</span>
            <input type="text" class="cmd-input" id="cmdInput" autofocus autocomplete="off" spellcheck="false" placeholder="输入指令...">
        </div>
    </div>
</div>

<script>
    const canvas = document.getElementById('waterfallCanvas');
    const ctx = canvas.getContext('2d');
    const logBox = document.getElementById('logBox');
    const cmdInput = document.getElementById('cmdInput');
    const statusIndicator = document.getElementById('statusIndicator');

    let isSignalLocked = false;
    let audioCtx = null, noiseNode = null, gainNode = null, audioStarted = false;

    function resize() {
        canvas.width = canvas.offsetWidth;
        canvas.height = canvas.offsetHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    // 动态波形与频谱渲染
    function renderSpectrum() {
        ctx.fillStyle = "rgba(2, 6, 3, 0.3)";
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // 背景网格
        ctx.strokeStyle = "rgba(0, 255, 102, 0.08)";
        ctx.lineWidth = 1;
        for (let x = 0; x < canvas.width; x += 25) {
            ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke();
        }

        // 绘制频率脉冲波
        ctx.beginPath();
        ctx.lineWidth = 1.5;
        ctx.strokeStyle = isSignalLocked ? "#ffaa00" : "#00ff66";
        ctx.shadowBlur = isSignalLocked ? 10 : 4;
        ctx.shadowColor = ctx.strokeStyle;

        const slice = canvas.width / 80;
        let x = 0;

        for (let i = 0; i < 80; i++) {
            let amp = Math.random() * 8 + 2; // 白噪音杂波
            
            // 锁定 4625 信号时，中间出现高能脉冲调幅
            if (isSignalLocked && i > 32 && i < 48) {
                amp = Math.sin((i - 32) * 0.2) * 32 + Math.random() * 5;
            }

            let y = canvas.height / 2 + (Math.random() > 0.5 ? amp : -amp);
            if (i === 0) ctx.moveTo(x, y);
            else ctx.lineTo(x, y);
            x += slice;
        }
        ctx.stroke();

        requestAnimationFrame(renderSpectrum);
    }
    renderSpectrum();

    function printLog(msg, color = '') {
        const div = document.createElement('div');
        if (color) div.style.color = color;
        div.innerHTML = msg;
        logBox.appendChild(div);
        logBox.scrollTop = logBox.scrollHeight;
    }

    function initAudio() {
        if (audioStarted) return;
        try {
            const AudioContext = window.AudioContext || window.webkitAudioContext;
            audioCtx = new AudioContext();
            const bufferSize = audioCtx.sampleRate * 2;
            const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
            const data = buffer.getChannelData(0);
            for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;

            noiseNode = audioCtx.createBufferSource();
            noiseNode.buffer = buffer;
            noiseNode.loop = true;
            gainNode = audioCtx.createGain();
            gainNode.gain.value = 0.03;

            noiseNode.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            noiseNode.start();
            audioStarted = true;
        } catch(e){}
    }

    cmdInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
            initAudio();
            const val = cmdInput.value.trim();
            cmdInput.value = '';
            if (!val) return;

            printLog(`&gt; ${val}`);
            const parts = val.toLowerCase().split(' ');
            const cmd = parts[0];
            const param = parts[1];

            if (cmd === 'help') {
                printLog(`[CONTROL COMMANDS]:<br>
  • <b>tune [kHz]</b> - 搜索指定频段 (例: tune 4625)<br>
  • <b>auth [code]</b> - 提交节点授权码 (例: auth 8912)<br>
  • <b>clear</b> - 清屏`);
            } 
            else if (cmd === 'clear') {
                logBox.innerHTML = '';
            } 
            else if (cmd === 'tune') {
                if (!param) {
                    printLog(`[ERR] 请指定频率。示例: tune 4625`, '#ff4444');
                    return;
                }
                if (param === '4625') {
                    isSignalLocked = true;
                    statusIndicator.innerText = "SIGNAL LOCKED // 4625 kHz";
                    statusIndicator.style.color = "#ffaa00";
                    printLog(`[LOCK 4625.0 kHz] 拦截到电台语音循环广播：`, '#ffaa00');
                    printLog(`&gt; "ANVB 8912 - REPEAT 8912"`);
                    if (gainNode) gainNode.gain.value = 0.01;
                } else {
                    isSignalLocked = false;
                    statusIndicator.innerText = "NO SIGNAL";
                    statusIndicator.style.color = "#00ff66";
                    printLog(`[TUNE ${param} kHz] 杂音干扰... 未发现有效载波。`);
                    if (gainNode) gainNode.gain.value = 0.04;
                }
            } 
            else if (cmd === 'auth') {
                if (param === '8912') {
                    printLog(`[AUTH SUCCESS] 凭证正确。正在进入 Stage 2...`, '#00ff66');
                    setTimeout(() => {
                        window.location.href = 'stage2.html';
                    }, 1200);
                } else {
                    printLog(`[AUTH FAILED] 授权码无效。`, '#ff4444');
                }
            } 
            else {
                printLog(`未知指令: ${cmd}。输入 'help' 查看指令集。`, '#ff4444');
            }
        }
    });

    document.addEventListener('click', () => cmdInput.focus());
</script>

</body>
</html>
