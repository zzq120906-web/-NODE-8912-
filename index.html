<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SDR-NODE // 废弃无线电接收终端</title>
    <style>
        :root {
            --green: #00ff66;
            --amber: #ffaa00;
            --red: #ff3333;
            --dim-green: rgba(0, 255, 102, 0.2);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body, html {
            width: 100%; height: 100%; background: #000;
            font-family: 'Courier New', 'Microsoft YaHei', sans-serif; overflow: hidden;
        }
        .viewport {
            position: relative; width: 100vw; height: 100vh;
            background: url('https://images.unsplash.com/photo-1518709268805-4e9042af9f23?q=80&w=2000&auto=format&fit=crop') center/cover no-repeat;
            display: flex; justify-content: center; align-items: center; filter: contrast(1.15) brightness(0.8);
        }
        .ambient-vignette {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle, rgba(0,0,0,0.2) 20%, rgba(0,0,0,0.95) 100%);
            pointer-events: none; z-index: 1;
        }
        .screen-glow {
            position: absolute; width: 700px; height: 480px;
            background: rgba(0, 255, 102, 0.03); border-radius: 50%; filter: blur(100px);
            pointer-events: none; z-index: 2; transition: background 1s ease;
        }
        .crt-frame {
            position: relative; z-index: 10; width: 94%; max-width: 760px;
            background: rgba(4, 10, 6, 0.95); border: 2px solid var(--dim-green);
            border-radius: 12px; padding: 22px;
            box-shadow: 0 0 60px rgba(0, 0, 0, 0.95), inset 0 0 20px rgba(0, 255, 102, 0.08);
            backdrop-filter: blur(6px);
        }
        .crt-frame::after {
            content: " "; position: absolute; top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.35) 50%);
            background-size: 100% 4px; pointer-events: none; border-radius: 10px;
        }
        .screen-header {
            display: flex; justify-content: space-between; align-items: center;
            color: var(--green); font-size: 12px; border-bottom: 1px solid var(--dim-green);
            padding-bottom: 8px; margin-bottom: 12px; letter-spacing: 1px; text-shadow: 0 0 4px var(--green);
        }
        .header-tags span {
            background: rgba(0, 255, 102, 0.1); padding: 2px 6px; border-radius: 3px; font-size: 10px; margin-left: 4px;
        }
        #spectrumCanvas {
            width: 100%; height: 125px; background: #010502;
            border: 1px solid var(--dim-green); margin-bottom: 12px; display: block; border-radius: 4px;
        }
        .terminal-log {
            height: 170px; overflow-y: auto; color: var(--green); font-size: 13px; line-height: 1.6;
            word-break: break-all; margin-bottom: 12px; text-shadow: 0 0 4px rgba(0, 255, 102, 0.3);
            user-select: text; padding-right: 5px;
        }
        .terminal-log::-webkit-scrollbar { width: 4px; }
        .terminal-log::-webkit-scrollbar-thumb { background: var(--dim-green); border-radius: 2px; }
        .command-bar {
            display: flex; align-items: center; background: rgba(0, 0, 0, 0.85);
            border: 1px solid var(--dim-green); padding: 10px 12px; border-radius: 4px;
        }
        .prompt { color: var(--green); margin-right: 10px; font-size: 13px; font-weight: bold; }
        .cmd-input {
            background: transparent; border: none; outline: none;
            color: #fff; font-family: inherit; font-size: 13px; flex: 1;
            text-shadow: 0 0 6px var(--green); user-select: text;
        }
        .highlight-cn { color: #fff; font-weight: bold; background: rgba(255,255,255,0.15); padding: 0 4px; border-radius: 2px; }
        .warn-cn { color: var(--amber); font-weight: bold; }
        .success-cn { color: var(--green); font-weight: bold; }
        .danger-cn { color: var(--red); font-weight: bold; }
    </style>
</head>
<body>

<div class="viewport">
    <div class="ambient-vignette"></div>
    <div class="screen-glow" id="screenGlow"></div>

    <div class="crt-frame">
        <div class="screen-header">
            <div>
                <b>废弃无线电监测站 // NODE-01</b>
                <span class="header-tags"><span>短波RX</span><span>无网隔离</span></span>
            </div>
            <span id="statusInd" class="warn-cn">系统待机中</span>
        </div>

        <canvas id="spectrumCanvas"></canvas>

        <div class="terminal-log" id="logBox">
[电源管理] 应急电池接通。主板供电恢复正常。<br>
[音频模块] 提示：点击屏幕任意位置激活音频引擎。<br>
[系统提示] 输入 <span class="highlight-cn">boot</span> 初始化系统，或输入 <span class="highlight-cn">help</span> 查看指令集...<br>
----------------------------------------------------------------------
        </div>

        <div class="command-bar">
            <span class="prompt">终端控制器:~#</span>
            <input type="text" class="cmd-input" id="cmdInput" autofocus autocomplete="off" spellcheck="false" placeholder="输入 boot 开始...">
        </div>
    </div>
</div>

<script>
    const canvas = document.getElementById('spectrumCanvas');
    const ctx = canvas.getContext('2d');
    const logBox = document.getElementById('logBox');
    const cmdInput = document.getElementById('cmdInput');
    const statusInd = document.getElementById('statusInd');
    const screenGlow = document.getElementById('screenGlow');

    let sysState = 0; 
    let filterActive = false;
    let audioCtx = null, noiseNode = null, noiseGain = null;

    function resize() { canvas.width = canvas.offsetWidth; canvas.height = canvas.offsetHeight; }
    window.addEventListener('resize', resize);
    resize();

    // 完整的 AudioContext 音频引擎（含白噪声与音效）
    function initAudio() {
        if (audioCtx) return;
        try {
            const AudioContext = window.AudioContext || window.webkitAudioContext;
            audioCtx = new AudioContext();
            
            // 创建无线电连续白噪声
            const bufSize = audioCtx.sampleRate * 2;
            const buf = audioCtx.createBuffer(1, bufSize, audioCtx.sampleRate);
            const data = buf.getChannelData(0);
            for (let i = 0; i < bufSize; i++) data[i] = Math.random() * 2 - 1;

            noiseNode = audioCtx.createBufferSource();
            noiseNode.buffer = buf; noiseNode.loop = true;
            noiseGain = audioCtx.createGain();
            noiseGain.gain.value = 0.003; // 初始极微弱背景声
            noiseNode.connect(noiseGain);
            noiseGain.connect(audioCtx.destination);
            noiseNode.start();
        } catch(e){}
    }

    // 按键敲击声
    function playKeySound() {
        if (!audioCtx) return;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(120 + Math.random() * 80, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.015, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.05);
        osc.connect(gain); gain.connect(audioCtx.destination);
        osc.start(); osc.stop(audioCtx.currentTime + 0.05);
    }

    // 蜂鸣反馈声（提示/报错/通关）
    function playBeep(freq, duration, type='sine') {
        if (!audioCtx) return;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.03, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + duration);
        osc.connect(gain); gain.connect(audioCtx.destination);
        osc.start(); osc.stop(audioCtx.currentTime + duration);
    }

    // 动态绘制示波器频谱波形
    function renderSpectrum() {
        ctx.fillStyle = "rgba(1, 5, 2, 0.22)";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.strokeStyle = "rgba(0, 255, 102, 0.08)";
        ctx.lineWidth = 1;
        for (let x = 0; x < canvas.width; x += 30) {
            ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke();
        }

        ctx.beginPath();
        ctx.lineWidth = 1.5;
        if (sysState === 4) {
            ctx.strokeStyle = "#ffaa00"; ctx.shadowBlur = 10; ctx.shadowColor = "#ffaa00";
        } else if (sysState >= 2) {
            ctx.strokeStyle = "#00ff66"; ctx.shadowBlur = 4; ctx.shadowColor = "#00ff66";
        } else {
            ctx.strokeStyle = "rgba(0, 255, 102, 0.2)"; ctx.shadowBlur = 0;
        }

        const slice = canvas.width / 90;
        let x = 0;
        for (let i = 0; i < 90; i++) {
            let amp = 2;
            if (sysState === 1) amp = Math.random() * 4;
            else if (sysState === 2) amp = Math.random() * 12 + 2;
            else if (sysState === 3) amp = Math.random() * 38 + 6;
            else if (sysState === 4) {
                if (i > 32 && i < 58) amp = Math.sin((i - 32) * 0.25) * 38 + Math.random() * 4;
                else amp = Math.random() * 6;
            }
            let y = canvas.height / 2 + (Math.random() > 0.5 ? amp : -amp);
            if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
            x += slice;
        }
        ctx.stroke();

        // 成功解调后屏显渲染
        if (sysState === 4) {
            ctx.font = "bold 17px 'Microsoft YaHei', sans-serif";
            ctx.fillStyle = "#ffaa00"; ctx.shadowBlur = 12; ctx.shadowColor = "#ffaa00";
            ctx.fillText("【信号解调成功】 授权密钥：8912", canvas.width / 2 - 150, canvas.height / 2 + 6);
        }

        requestAnimationFrame(renderSpectrum);
    }
    renderSpectrum();

    function print(msg, customClass = '') {
        const div = document.createElement('div');
        if (customClass) div.className = customClass;
        div.innerHTML = msg;
        logBox.appendChild(div);
        logBox.scrollTop = logBox.scrollHeight;
    }

    cmdInput.addEventListener('keydown', (e) => {
        initAudio();
        playKeySound();

        if (e.key === 'Enter') {
            const val = cmdInput.value.trim();
            cmdInput.value = '';
            if (!val) return;

            print(`终端控制器:~# ${val}`);
            const parts = val.split(' ');
            const cmd = parts[0].toLowerCase();
            const param = parts[1] ? parts[1].toLowerCase() : '';

            if (cmd === 'boot') {
                if (sysState >= 1) return print(`[提示] 系统已经处于运行状态。`, 'warn-cn');
                sysState = 1;
                if(noiseGain) noiseGain.gain.value = 0.008; // 增加背景噪声感
                statusInd.innerText = "系统已启动 (天线离线)"; statusInd.className = "warn-cn";
                screenGlow.style.background = "rgba(0, 255, 102, 0.1)";
                playBeep(440, 0.15);
                print(`[系统加载] 核心模块装载完毕...`, 'success-cn');
                setTimeout(() => { print(`[警告] 外部天线未响应。请输入 <span class="highlight-cn">cat 硬件日志.log</span> 排查故障。`); }, 500);
            }
            else if (sysState === 0 && cmd !== 'help') {
                playBeep(200, 0.2, 'sawtooth');
                print(`[错误] 请先输入 <span class="highlight-cn">boot</span> 初始化系统。`, 'danger-cn'); 
            }
            else if (cmd === 'ls') { print(`- 硬件日志.log<br>- 广播日志_1999.txt`); }
            else if (cmd === 'cat') {
                if (param === '硬件日志.log' || param === '硬件日志') {
                    print(`【硬件诊断】天线处于离线状态。请输入 <span class="highlight-cn">enable-antenna</span> 激活天线。`, 'warn-cn');
                } else if (param === '广播日志_1999.txt' || param === '广播日志_1999') {
                    print(`【历史记录】未标注短波频段：<br>“目标为强干扰蜂鸣台频段，频率为 4000 kHz 叠加 625 kHz...”<br>提示：若调频后杂音过大，需开启数字滤波。`, 'warn-cn');
                } else print(`用法：cat [文件名] （可用 ls 查看文件列表）`, 'danger-cn');
            }
            else if (cmd === 'enable-antenna') {
                if (sysState >= 2) return print(`[提示] 天线已在激活状态。`, 'warn-cn');
                sysState = 2;
                if(noiseGain) noiseGain.gain.value = 0.015; // 天线启动，白噪声变大
                statusInd.innerText = "天线已激活 // 等待调频"; statusInd.className = "success-cn";
                playBeep(600, 0.2);
                print(`[硬件响应] 天线阵列已强行启动。请使用指令 <span class="highlight-cn">tune [频率]</span> 进行调频解调。`, 'success-cn');
            }
            else if (cmd === 'tune') {
                if (sysState < 2) return print(`[错误] 天线未激活，无法调频！请先输入 <span class="highlight-cn">enable-antenna</span>。`, 'danger-cn');
                if (param === '4625') {
                    if (filterActive) {
                        sysState = 4; statusInd.innerText = "信号锁定 // 4625 kHz"; statusInd.className = "warn-cn";
                        if(noiseGain) noiseGain.gain.value = 0.003; // 降噪
                        playBeep(880, 0.3);
                        print(`[信号锁定] 观察上方示波器屏显浮现的授权密钥！`, 'success-cn');
                    } else {
                        sysState = 3; statusInd.innerText = "检测到信号 (重度干扰)"; statusInd.className = "danger-cn";
                        if(noiseGain) noiseGain.gain.value = 0.035; // 强干扰大噪音
                        playBeep(300, 0.4, 'sawtooth');
                        print(`[警告] 目标频段干扰过大，波形混淆！请输入 <span class="highlight-cn">filter on</span> 开启滤波！`, 'warn-cn');
                    }
                } else {
                    playBeep(180, 0.2);
                    print(`[TUNE ${param || '未知'}] 只有一片白噪声... (提示：查阅 广播日志_1999.txt 寻找频段信息)`);
                }
            }
            else if (cmd === 'filter') {
                if (param === 'on') {
                    filterActive = true;
                    playBeep(520, 0.15);
                    print(`[滤波电路] 硬件降噪模块已开启。`, 'success-cn');
                    if (sysState === 3) {
                        sysState = 4; statusInd.innerText = "信号锁定 // 4625 kHz"; statusInd.className = "warn-cn";
                        if(noiseGain) noiseGain.gain.value = 0.003; // 降噪成功
                        playBeep(880, 0.3);
                        print(`[信号解调完成] 观察上方示波器屏显高亮浮现的授权密钥！`, 'success-cn');
                    }
                } else print(`用法：filter on`, 'danger-cn');
            }
            else if (cmd === 'auth') {
                if (param === '8912') {
                    playBeep(1000, 0.5);
                    print(`[授权成功] 身份验证通过！正在接入第二层核心数据网络...`, 'success-cn');
                    setTimeout(() => { window.location.href = 'stage2.html'; }, 1200);
                } else {
                    playBeep(150, 0.3, 'sawtooth');
                    print(`[授权失败] 密钥错误！解调成功后密钥会显现在上方示波器屏幕上。`, 'danger-cn');
                }
            }
            else if (cmd === 'help') {
                print(`【系统操作指令指南】:<br>
• <span class="highlight-cn">boot</span> - 初始化终端系统<br>
• <span class="highlight-cn">ls</span> - 列出当前目录下文件<br>
• <span class="highlight-cn">cat [文件名]</span> - 查看文件内容<br>
• <span class="highlight-cn">enable-antenna</span> - 强行激活天线阵列<br>
• <span class="highlight-cn">tune [频率]</span> - 调谐接收指定 kHz 频段<br>
• <span class="highlight-cn">filter on</span> - 开启数字滤波降噪<br>
• <span class="highlight-cn">auth [密钥]</span> - 提交通关密钥认证<br>
• <span class="highlight-cn">clear</span> - 清屏`);
            }
            else if (cmd === 'clear') { logBox.innerHTML = ''; }
            else {
                playBeep(200, 0.1, 'sawtooth');
                print(`未识别指令: ${cmd}。输入 <span class="highlight-cn">help</span> 查看帮助手册。`, 'danger-cn');
            }
        }
    });

    document.addEventListener('click', () => {
        initAudio();
        cmdInput.focus();
    });
</script>

</body>
</html>
