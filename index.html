<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>SDR-NODE // 强化版</title>
    <style>
        /* 样式保持不变 */
        :root { --green: #00ff66; }
        body { background: #000; color: var(--green); font-family: 'Courier New'; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; }
        .crt { width: 600px; padding: 20px; border: 1px solid var(--green); }
        .cmd-input { background: transparent; border: none; color: #fff; width: 100%; outline: none; }
    </style>
</head>
<body>
    <div class="crt">
        <div id="log">系统就绪。输入 boot 启动。<br></div>
        <input type="text" class="cmd-input" id="cmdInput" autofocus>
    </div>

<script>
    let audioCtx = null;
    let noiseGain = null;

    // 1. 初始化音频系统
    function initAudio() {
        if (audioCtx) return;
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        
        // 白噪声引擎
        const buf = audioCtx.createBuffer(1, audioCtx.sampleRate * 2, audioCtx.sampleRate);
        const data = buf.getChannelData(0);
        for (let i = 0; i < data.length; i++) data[i] = Math.random() * 2 - 1;
        
        const noiseNode = audioCtx.createBufferSource();
        noiseNode.buffer = buf;
        noiseNode.loop = true;
        noiseGain = audioCtx.createGain();
        noiseGain.gain.value = 0.02; // 稍微调大一点白噪声
        noiseNode.connect(noiseGain);
        noiseGain.connect(audioCtx.destination);
        noiseNode.start();
    }

    // 2. 强化版按键音：显著提升增益和频率响应
    function playKeySound() {
        if (!audioCtx) return;
        // 确保音频上下文恢复（针对部分浏览器休眠状态）
        if (audioCtx.state === 'suspended') audioCtx.resume();

        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(440, audioCtx.currentTime); // 提高基础频率，确保能听见
        osc.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + 0.05);
        
        gain.gain.setValueAtTime(0.3, audioCtx.currentTime); // 增益调大到0.3
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.05);
        
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        
        osc.start();
        osc.stop(audioCtx.currentTime + 0.05);
    }

    const cmdInput = document.getElementById('cmdInput');
    cmdInput.addEventListener('keydown', (e) => {
        initAudio(); 
        playKeySound(); // 每次按键都触发
        
        if (e.key === 'Enter') {
            document.getElementById('log').innerHTML += `> ${cmdInput.value}<br>`;
            cmdInput.value = '';
        }
    });

    // 点击页面任意位置强制激活音频
    document.addEventListener('click', () => {
        initAudio();
        if (audioCtx.state === 'suspended') audioCtx.resume();
    });
</script>
</body>
</html>
