<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SDR-NODE // 第二层数据解调终端</title>
    <style>
        :root {
            --cyan: #00f3ff;
            --purple: #bc13fe;
            --amber: #ffaa00;
            --dim-cyan: rgba(0, 243, 255, 0.25);
            --red: #ff3366;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }

        body, html {
            width: 100%; height: 100%;
            background: #000;
            font-family: 'Courier New', 'Microsoft YaHei', sans-serif;
            overflow: hidden;
        }

        .viewport {
            position: relative;
            width: 100vw; height: 100vh;
            background: url('https://images.unsplash.com/photo-1518709268805-4e9042af9f23?q=80&w=2000&auto=format&fit=crop') center/cover no-repeat;
            display: flex; justify-content: center; align-items: center;
            filter: contrast(1.2) hue-rotate(180deg) brightness(0.75);
        }

        .ambient-vignette {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle, rgba(0,0,0,0.2) 20%, rgba(0,0,0,0.95) 100%);
            pointer-events: none; z-index: 1;
        }

        .screen-glow {
            position: absolute; width: 750px; height: 500px;
            background: rgba(0, 243, 255, 0.05);
            border-radius: 50%; filter: blur(100px);
            pointer-events: none; z-index: 2;
        }

        .crt-frame {
            position: relative; z-index: 10;
            width: 94%; max-width: 780px;
            background: rgba(3, 6, 12, 0.95);
            border: 2px solid var(--dim-cyan);
            border-radius: 12px; padding: 22px;
            box-shadow: 0 0 60px rgba(0, 243, 255, 0.2), inset 0 0 20px rgba(0, 243, 255, 0.1);
            backdrop-filter: blur(6px);
        }

        .crt-frame::after {
            content: " "; position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.35) 50%);
            background-size: 100% 4px; pointer-events: none; border-radius: 10px;
        }

        .screen-header {
            display: flex; justify-content: space-between; align-items: center;
            color: var(--cyan); font-size: 12px;
            border-bottom: 1px solid var(--dim-cyan);
            padding-bottom: 8px; margin-bottom: 12px;
            letter-spacing: 1px; text-shadow: 0 0 6px var(--cyan);
        }

        .header-tags span {
            background: rgba(0, 243, 255, 0.15);
            padding: 2px 6px; border-radius: 3px; font-size: 10px; margin-left: 4px; color: #fff;
        }

        #waterfallCanvas {
            width: 100%; height: 140px;
            background: #010308;
            border: 1px solid var(--dim-cyan);
            margin-bottom: 12px; display: block;
            border-radius: 4px;
        }

        .terminal-log {
            height: 180px; overflow-y: auto;
            color: var(--cyan); font-size: 13px; line-height: 1.6;
            word-break: break-all; margin-bottom: 12px;
            text-shadow: 0 0 4px rgba(0, 243, 255, 0.4);
            user-select: text;
            padding-right: 5px;
        }

        .terminal-log::-webkit-scrollbar { width: 4px; }
        .terminal-log::-webkit-scrollbar-thumb { background: var(--dim-cyan); border-radius: 2px; }

        .command-bar {
            display: flex; align-items: center;
            background: rgba(0, 0, 0, 0.85);
            border: 1px solid var(--dim-cyan);
            padding: 10px 12px; border-radius: 4px;
        }

        .prompt { color: var(--cyan); margin-right: 10px; font-size: 13px; font-weight: bold; }
        .cmd-input {
            background: transparent; border: none; outline: none;
            color: #fff; font-family: inherit; font-size: 13px; flex: 1;
            text-shadow: 0 0 6px var(--cyan); user-select: text;
        }

        .highlight-cn { color: #fff; font-weight: bold; background: rgba(0, 243, 255, 0.2); padding: 0 5px; border-radius: 2px; }
        .warn-cn { color: var(--amber); font-weight: bold; }
        .success-cn { color: var(--cyan); font-weight: bold; }
        .purple-cn { color: var(--purple); font-weight: bold; }
        .danger-cn { color: var(--red); font-weight: bold; }
    </style>
</head>
<body>

<div class="viewport">
    <div class="ambient-vignette"></div>
    <div class="screen-glow"></div>

    <div class="crt-frame">
        <div class="screen-header">
            <div>
                <b>数据链路解调终端 // STAGE 2</b>
                <span class="header-tags"><span>宽带FFT扫描</span><span>多载波监听</span></span>
            </div>
            <span id="statusInd" class="success-cn">链路已建立</span>
        </div>

        <canvas id="waterfallCanvas"></canvas>

        <div class="terminal-log" id="logBox">
[网络通信] 成功越过一层网关！欢迎接入第二关数据通信链。<br>
[系统指示] 当前频段正在传输多路加密数据。输入 <span class="highlight-cn">scan</span> 全频段扫描，或输入 <span class="highlight-cn">help</span> 查看指令。<br>
----------------------------------------------------------------------
        </div>

        <div class="command-bar">
            <span class="prompt">数据解调器:~#</span>
            <input type="text" class="cmd-input" id="cmdInput" autofocus autocomplete="off" spellcheck="false" placeholder="输入 scan 扫描信号...">
        </div>
    </div>
</div>

<script>
    const canvas = document.getElementById('waterfallCanvas');
    const ctx = canvas.getContext('2d');
    const logBox = document.getElementById('logBox');
    const cmdInput = document.getElementById('cmdInput');
    const statusInd = document.getElementById('statusInd');

    let fragments = { f1: false, f2: false, f3: false };
    let audioCtx = null;

    function resize() { canvas.width = canvas.offsetWidth; canvas.height = canvas.offsetHeight; }
    window.addEventListener('resize', resize);
    resize();

    function initAudio() {
        if (audioCtx) return;
        try {
            const AudioContext = window.AudioContext || window.webkitAudioContext;
            audioCtx = new AudioContext();
        } catch(e){}
    }

    function playKeySound() {
        if (!audioCtx) return;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(300 + Math.random() * 200, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.015, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.04);
        osc.connect(gain); gain.connect(audioCtx.destination);
        osc.start(); osc.stop(audioCtx.currentTime + 0.04);
    }

    function playScanSound() {
        if (!audioCtx) return;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(150, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(800, audioCtx.currentTime + 0.3);
        gain.gain.setValueAtTime(0.03, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.3);
        osc.connect(gain); gain.connect(audioCtx.destination);
        osc.start(); osc.stop(audioCtx.currentTime + 0.3);
    }

    const waterfallRows = [];
    const maxRows = 70;

    function renderWaterfall() {
        const row = new Uint8Array(80);
        for (let i = 0; i < 80; i++) {
            row[i] = Math.random() * 40;
        }
        row[20] = 200 + Math.random() * 55;
        row[40] = 220 + Math.random() * 35;
        row[65] = 240 + Math.random() * 15;

        waterfallRows.unshift(row);
        if (waterfallRows.length > maxRows) waterfallRows.pop();

        ctx.fillStyle = "#010308";
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        const cellWidth = canvas.width / 80;
        const cellHeight = canvas.height / maxRows;

        for (let r = 0; r < waterfallRows.length; r++) {
            const currentRow = waterfallRows[r];
            for (let c = 0; c < 80; c++) {
                const val = currentRow[c];
                if (val > 150) {
                    ctx.fillStyle = val > 220 ? "#ffaa00" : "#00f3ff";
                } else {
                    ctx.fillStyle = `rgba(0, 100, 150, ${val / 150 * 0.3})`;
                }
                ctx.fillRect(c * cellWidth, r * cellHeight, cellWidth, cellHeight);
            }
        }

        ctx.fillStyle = "rgba(0, 243, 255, 0.7)";
        ctx.font = "10px monospace";
        ctx.fillText("1024 kHz", canvas.width * (20/80) - 20, 12);
        ctx.fillText("2048 kHz", canvas.width * (40/80) - 20, 12);
        ctx.fillText("4096 kHz", canvas.width * (65/80) - 20, 12);

        requestAnimationFrame(renderWaterfall);
    }
    renderWaterfall();

    function print(msg, customClass = '') {
        const div = document.createElement('div');
        if (customClass) div.className = customClass;
        div.innerHTML = msg;
        logBox.appendChild(div);
        logBox.scrollTop = logBox.scrollHeight;
    }

    cmdInput.addEventListener('keydown', (e) => {
        initAudio();
        playKeySound();

        if (e.key === 'Enter') {
            const val = cmdInput.value.trim();
            cmdInput.value = '';
            if (!val) return;

            print(`数据解调器:~# ${val}`);
            const parts = val.split(' ');
            const cmd = parts[0].toLowerCase();
            const param = parts[1] ? parts[1].toUpperCase() : '';

            if (cmd === 'scan') {
                playScanSound();
                print(`[FFT 宽带扫描中...] 正在检测全频段能量分布...`, 'success-cn');
                setTimeout(() => {
                    print(`[扫描完成] 在瀑布图上捕获到 3 个强载波数据信号：<br>
  • 频段 1: <span class="highlight-cn">1024 kHz</span> （正在发射数据）<br>
  • 频段 2: <span class="highlight-cn">2048 kHz</span> （正在发射数据）<br>
  • 频段 3: <span class="highlight-cn">4096 kHz</span> （正在发射数据）<br>
  请使用 <span class="highlight-cn">tune [频率]</span> 分别提取秘钥碎片。`, 'warn-cn');
                }, 500);
            }
            else if (cmd === 'tune') {
                if (param === '1024') {
                    fragments.f1 = true;
                    print(`[1024 kHz 解调成功] 获得碎片 1：<span class="highlight-cn">ECHO</span>`, 'success-cn');
                } else if (param === '2048') {
                    fragments.f2 = true;
                    print(`[2048 kHz 解调成功] 获得碎片 2：<span class="highlight-cn">PROTOCOL</span>`, 'success-cn');
                } else if (param === '4096') {
                    fragments.f3 = true;
                    print(`[4096 kHz 解调成功] 获得碎片 3：<span class="highlight-cn">2026</span>`, 'success-cn');
                } else {
                    print(`[TUNE ${param}] 目标频段无有效载波，请检查瀑布图上的高亮频段（输入 scan 查看）。`, 'danger-cn');
                }

                if (fragments.f1 && fragments.f2 && fragments.f3) {
                    print(`[系统提示] 3 个数据碎片已全部分离！请输入 <span class="highlight-cn">cat 组合规则.txt</span> 查看合成公式。`, 'warn-cn');
                }
            }
            else if (cmd === 'ls') {
                print(`- 组合规则.txt （秘钥拼装说明）`);
            }
            else if (cmd === 'cat') {
                if (param === '组合规则.TXT' || param === '组合规则') {
                    print(`【秘钥拼装说明】<br>请将提取到的三个碎片按频率从低到高用短横线连接：<br><span class="highlight-cn">碎片1-碎片2-碎片3</span><br>组合完成后，使用提交指令：<span class="highlight-cn">submit [最终秘钥]</span>`, 'warn-cn');
                } else {
                    print(`用法：cat 组合规则.txt`, 'danger-cn');
                }
            }
            else if (cmd === 'submit') {
                if (param === 'ECHO-PROTOCOL-2026') {
                    print(`[校验成功] 秘钥正确！第二层数据链路已完全解密通关！`, 'success-cn');
                    statusInd.innerText = "STAGE 2 CLEARED";
                    statusInd.className = "warn-cn";
                    setTimeout(() => {
                        alert("🎉 恭喜通关 SDR 无线电解密第二关！");
                    }, 1000);
                } else {
                    print(`[校验失败] 秘钥格式错误。格式示例：ECHO-PROTOCOL-2026`, 'danger-cn');
                }
            }
            else if (cmd === 'help') {
                print(`【第二关帮助指令】:<br>
  • <span class="highlight-cn">scan</span> - 扫描全频段高亮信号<br>
  • <span class="highlight-cn">tune [频率]</span> - 解调特定频段（例：tune 1024）<br>
  • <span class="highlight-cn">cat 组合规则.txt</span> - 查看碎片拼装方法<br>
  • <span class="highlight-cn">submit [秘钥]</span> - 拼装完成后提交通关<br>
  • <span class="highlight-cn">clear</span> - 清屏`);
            }
            else if (cmd === 'clear') { logBox.innerHTML = ''; }
            else { print(`未识别指令: ${cmd}。输入 <span class="highlight-cn">help</span> 获取帮助。`, 'danger-cn'); }
        }
    });

    document.addEventListener('click', () => cmdInput.focus());
</script>

</body>
</html>
