<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SDR-NODE // 深层隔离区 (RESTRICTED)</title>
    <style>
        :root {
            --green: #00ff66;
            --amber: #ffaa00;
            --red: #ff3333;
            --cyan: #00e5ff;
            --dim-green: rgba(0, 255, 102, 0.2);
            --dim-red: rgba(255, 51, 51, 0.2);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }

        body, html {
            width: 100%; height: 100%;
            background: #020402;
            font-family: 'Courier New', 'Microsoft YaHei', sans-serif;
            overflow: hidden;
        }

        /* 更换为充满工业废墟、幽暗深渊感的恐怖风底图 */
        .viewport {
            position: relative;
            width: 100vw; height: 100vh;
            background: url('https://images.unsplash.com/photo-1518770660439-4636190af475?q=80&w=2000&auto=format&fit=crop') center/cover no-repeat;
            display: flex; justify-content: center; align-items: center;
            filter: contrast(1.3) brightness(0.45) saturate(1.5);
        }

        .ambient-vignette {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle, rgba(0,20,5,0.1) 10%, rgba(0,0,0,0.98) 85%);
            pointer-events: none; z-index: 1;
        }

        .screen-glow {
            position: absolute; width: 700px; height: 480px;
            background: rgba(0, 255, 102, 0.04);
            border-radius: 50%; filter: blur(110px);
            pointer-events: none; z-index: 2;
            transition: background 1s ease;
        }

        /* CRT 显示屏外壳 */
        .crt-frame {
            position: relative; z-index: 10;
            width: 94%; max-width: 760px;
            background: rgba(2, 8, 4, 0.96);
            border: 2px solid var(--dim-green);
            border-radius: 12px; padding: 22px;
            box-shadow: 0 0 60px rgba(0, 0, 0, 0.98), inset 0 0 25px rgba(0, 255, 102, 0.06);
            backdrop-filter: blur(8px);
        }

        /* CRT 扫描线效应 */
        .crt-frame::after {
            content: " "; position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.4) 50%);
            background-size: 100% 4px; pointer-events: none; border-radius: 10px;
        }

        .screen-header {
            display: flex; justify-content: space-between; align-items: center;
            color: var(--green); font-size: 12px;
            border-bottom: 1px solid var(--dim-green);
            padding-bottom: 8px; margin-bottom: 12px;
            letter-spacing: 1px; text-shadow: 0 0 4px var(--green);
        }

        .header-tags span {
            background: rgba(0, 255, 102, 0.1);
            padding: 2px 6px; border-radius: 3px; font-size: 10px; margin-left: 4px;
        }

        /* 动态心跳/威胁示波器 */
        #spectrumCanvas {
            width: 100%; height: 120px;
            background: #010401;
            border: 1px solid var(--dim-green);
            margin-bottom: 12px; display: block;
            border-radius: 4px;
        }

        /* 交互日志区 */
        .terminal-log {
            height: 175px; overflow-y: auto;
            color: var(--green); font-size: 13px; line-height: 1.6;
            word-break: break-all; margin-bottom: 12px;
            text-shadow: 0 0 4px rgba(0, 255, 102, 0.3);
            user-select: text;
            padding-right: 5px;
        }

        .terminal-log::-webkit-scrollbar { width: 4px; }
        .terminal-log::-webkit-scrollbar-thumb { background: var(--dim-green); border-radius: 2px; }

        /* 命令行输入框 */
        .command-bar {
            display: flex; align-items: center;
            background: rgba(0, 0, 0, 0.85);
            border: 1px solid var(--dim-green);
            padding: 10px 12px; border-radius: 4px;
        }

        .prompt { color: var(--green); margin-right: 10px; font-size: 13px; font-weight: bold; }
        .cmd-input {
            background: transparent; border: none; outline: none;
            color: #fff; font-family: inherit; font-size: 13px; flex: 1;
            text-shadow: 0 0 6px var(--green); user-select: text;
        }

        .highlight-cn { color: #fff; font-weight: bold; background: rgba(255,255,255,0.15); padding: 0 4px; border-radius: 2px; }
        .warn-cn { color: var(--amber); font-weight: bold; }
        .success-cn { color: var(--green); font-weight: bold; }
        .danger-cn { color: var(--red); font-weight: bold; text-shadow: 0 0 6px var(--red); }
    </style>
</head>
<body>

<div class="viewport">
    <div class="ambient-vignette"></div>
    <div class="screen-glow" id="screenGlow"></div>

    <div class="crt-frame">
        <div class="screen-header">
            <div>
                <b>地下核心沙盒 // SECTOR-04</b>
                <span class="header-tags"><span>已建立握手</span><span>威胁等级: 高</span></span>
            </div>
            <span id="statusInd" class="warn-cn">意识同步中...</span>
        </div>

        <canvas id="spectrumCanvas"></canvas>

        <div class="terminal-log" id="logBox">
[系统内核] 验证码 8912 确认。底层沙盒已挂载。<br>
[剧情交接] 你通过第一关的短波 4625 信号，成功反向黑入了这座废弃数十年的深层地下科研所。<br>
[恐怖警告] 这里的日志显示，当年的研究员并未撤离，而是被“锁”在了数据流里……<br>
[提示] 输入 <span class="highlight-cn">ls</span> 查看公开文件，或直接探索深层加密档案。<br>
----------------------------------------------------------------------
        </div>

        <div class="command-bar">
            <span class="prompt">SECTOR-04:~#</span>
            <input type="text" class="cmd-input" id="cmdInput" autofocus autocomplete="off" spellcheck="false" placeholder="输入 ls 查看文件...">
        </div>
    </div>
</div>

<script>
    const canvas = document.getElementById('spectrumCanvas');
    const ctx = canvas.getContext('2d');
    const logBox = document.getElementById('logBox');
    const cmdInput = document.getElementById('cmdInput');
    const statusInd = document.getElementById('statusInd');
    const screenGlow = document.getElementById('screenGlow');

    let audioCtx = null, noiseNode = null, noiseGain = null;
    let unlockedDeep = false; // 是否解开了深层文件

    function resize() { canvas.width = canvas.offsetWidth; canvas.height = canvas.offsetHeight; }
    window.addEventListener('resize', resize);
    resize();

    // 🔊 恐怖低频环境音与白噪音合成
    function initAudio() {
        if (audioCtx) return;
        try {
            const AudioContext = window.AudioContext || window.webkitAudioContext;
            audioCtx = new AudioContext();

            const buf = audioCtx.createBuffer(1, audioCtx.sampleRate * 2, audioCtx.sampleRate);
            const data = buf.getChannelData(0);
            for (let i = 0; i < data.length; i++) data[i] = (Math.random() * 2 - 1) * 0.2;

            noiseNode = audioCtx.createBufferSource();
            noiseNode.buffer = buf; noiseNode.loop = true;

            noiseGain = audioCtx.createGain();
            noiseGain.gain.value = 0.004;

            noiseNode.connect(noiseGain);
            noiseGain.connect(audioCtx.destination);
            noiseNode.start();
        } catch(e){}
    }

    function playKeySound() {
        if (!audioCtx) return;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(100 + Math.random() * 50, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.01, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.05);
        osc.connect(gain); gain.connect(audioCtx.destination);
        osc.start(); osc.stop(audioCtx.currentTime + 0.05);
    }

    function playHorrorSound() {
        if (!audioCtx) return;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(150, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(40, audioCtx.currentTime + 0.5);
        gain.gain.setValueAtTime(0.03, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.5);
        osc.connect(gain); gain.connect(audioCtx.destination);
        osc.start(); osc.stop(audioCtx.currentTime + 0.5);
    }

    // 动态波形：模拟心跳与异常脉冲
    function renderSpectrum() {
        ctx.fillStyle = "rgba(1, 4, 1, 0.25)";
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.strokeStyle = "rgba(0, 255, 102, 0.07)";
        ctx.lineWidth = 1;
        for (let x = 0; x < canvas.width; x += 30) {
            ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke();
        }

        ctx.beginPath();
        ctx.lineWidth = 1.6;
        ctx.strokeStyle = unlockedDeep ? "#ff3333" : "#00ff66";
        ctx.shadowBlur = unlockedDeep ? 8 : 4;
        ctx.shadowColor = unlockedDeep ? "#ff3333" : "#00ff66";

        const slice = canvas.width / 90;
        let x = 0;

        for (let i = 0; i < 90; i++) {
            let amp = Math.random() * 6 + 2;
            if (unlockedDeep && i > 40 && i < 50) {
                amp = Math.sin(i * 0.4) * 35; // 恐怖心跳突波
            }
            let y = canvas.height / 2 + (Math.random() > 0.5 ? amp : -amp);
            if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
            x += slice;
        }
        ctx.stroke();

        requestAnimationFrame(renderSpectrum);
    }
    renderSpectrum();

    function print(msg, customClass = '') {
        const div = document.createElement('div');
        if (customClass) div.className = customClass;
        div.innerHTML = msg;
        logBox.appendChild(div);
        logBox.scrollTop = logBox.scrollHeight;
    }

    // 交互逻辑
    cmdInput.addEventListener('keydown', (e) => {
        initAudio();
        playKeySound();

        if (e.key === 'Enter') {
            const val = cmdInput.value.trim();
            cmdInput.value = '';
            if (!val) return;

            print(`SECTOR-04:~# ${val}`);
            const parts = val.split(' ');
            const cmd = parts[0].toLowerCase();
            const param = parts[1] ? parts[1].toLowerCase() : '';

            // 1. 查看文件列表（分为浅层公开和深层加密）
            if (cmd === 'ls') {
                print(`【当前目录服务器档案】:<br>
  [公开] <span class="highlight-cn">public_memo.txt</span> （研究所日常行政备忘录）<br>
  [公开] <span class="highlight-cn">incident_1999.log</span> （关于 4625 信号异常的初步报告）<br>
  [加密] <span class="danger-cn">core_containment.dat [LOCKED]</span> （核心收容体实验记录 - 需要解密）<br>
  [加密] <span class="danger-cn">subject_zero.log [LOCKED]</span> （零号实验体意识残留 - 需要解密）`);
            }
            // 2. 查看文件
            else if (cmd === 'cat') {
                if (param === 'public_memo.txt' || param === 'public_memo') {
                    print(`【行政备忘录】<br>最近值班人员精神状态很不稳定，总说听见墙壁里有电台播报声。另外，实验室紧急解密密码已临时归档在隔壁 incident_1999.log 中，密钥代号为 <span class="highlight-cn">9982</span>。`);
                } else if (param === 'incident_1999.log' || param === 'incident_1999') {
                    print(`【异常报告】<br>“我们在 4625 频段捕获到了非人类语法的生物电磁波。为了解密更深层的收容档案（如 core_containment.dat），请在终端输入命令：<span class="highlight-cn">decrypt 9982</span> 破开防火墙。”`);
                } else if (param === 'core_containment.dat' || param === 'subject_zero.log') {
                    if (!unlockedDeep) {
                        print(`[拒绝访问] 该文件受高级沙盒加密保护！请先阅读公开文件寻找解密指令（输入 decrypt [密码]）。`, 'danger-cn');
                    } else {
                        if (param.includes('core')) {
                            print(`【核心收容体记录】<br>“它不是机器，它是一团有思维的电磁迷因。任何试图通过终端与它对话的人，都会成为它肉体复苏的载体……回头吧，你身后有呼吸声。”`, 'warn-cn');
                        } else {
                            print(`【零号实验体意识残留】<br>“救救我……我就在终端屏幕的另一边。输入最终覆写指令：<span class="highlight-cn">override ECHO-7704</span> 彻底格式化这里，否则你也出不去了！”`, 'danger-cn');
                        }
                    }
                } else {
                    print(`[错误] 找不到该文件。输入 <span class="highlight-cn">ls</span> 查看列表。`, 'danger-cn');
                }
            }
            // 3. 解密深层文件（不难，线索在公开文件中）
            else if (cmd === 'decrypt') {
                if (param === '9982') {
                    unlockedDeep = true;
                    playHorrorSound();
                    statusInd.innerText = "警告：深层加密已破开";
                    statusInd.className = "danger-cn";
                    screenGlow.style.background = "rgba(255, 51, 51, 0.08)";
                    print(`[防火墙突破] 解密成功！深层文件 <span class="danger-cn">core_containment.dat</span> 与 <span class="danger-cn">subject_zero.log</span> 已强制解密！`, 'success-cn');
                    print(`[诡异现象] 终端屏幕剧烈闪烁了一下……现在你可以使用 <span class="highlight-cn">cat</span> 阅读这两份恐怖档案了。`);
                } else {
                    print(`[错误] 密码错误！请仔细阅读公开日志（如 public_memo.txt）寻找密码。`, 'danger-cn');
                }
            }
            // 4. 终极覆写通关
            else if (cmd === 'override') {
                if (param === 'echo-7704' || param === 'ECHO-7704') {
                    playHorrorSound();
                    print(`[系统内核] 收到最高覆写指令：ECHO-7704。`, 'success-cn');
                    print(`[毁灭执行] 正在格式化本地磁道，彻底切断与地下实体的量子纠缠……`, 'success-cn');
                    print(`[通关成功] 意识链接已断开，你成功逃离了 4625 的恐怖深渊！`, 'success-cn');

                    document.body.style.boxShadow = "inset 0 0 150px #ff3333";
                    setTimeout(() => {
                        alert("【第二关完美通关】你粉碎了地下科研所的意识陷阱，成功回归现实！");
                        // 预留第三关跳转：window.location.href = 'stage3.html';
                    }, 2000);
                } else {
                    print(`[拒绝执行] 覆写代码不正确！请先解密深层档案（cat subject_zero.log）获取完整代码。`, 'danger-cn');
                }
            }
            // 帮助
            else if (cmd === 'help') {
                print(`【探索指令指南】:<br>
  • <span class="highlight-cn">ls</span> - 扫描服务器文件（分公开与加密）<br>
  • <span class="highlight-cn">cat [文件名]</span> - 阅读文件内容获取恐怖背景与密码<br>
  • <span class="highlight-cn">decrypt [密码]</span> - 输入从浅层日志中找到的密码，破开深层加密文件<br>
  • <span class="highlight-cn">override [终极代码]</span> - 在深层档案中找到终极代码后执行通关<br>
  • <span class="highlight-cn">clear</span> - 清屏`);
            }
            else if (cmd === 'clear') { logBox.innerHTML = ''; }
            else { print(`未识别的指令: ${cmd}。输入 <span class="highlight-cn">help</span> 获取帮助。`, 'danger-cn'); }
        }
    });

    document.addEventListener('click', () => cmdInput.focus());
</script>

</body>
</html>
