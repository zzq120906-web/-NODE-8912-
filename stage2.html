<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SDR-NODE // 内部终端网络 (4625-SUB)</title>
    <style>
        :root {
            --green: #00ff66;
            --amber: #ffaa00;
            --red: #ff3333;
            --cyan: #00e5ff;
            --dim-green: rgba(0, 255, 102, 0.2);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }

        body, html {
            width: 100%; height: 100%;
            background: #000;
            font-family: 'Courier New', 'Microsoft YaHei', sans-serif;
            overflow: hidden;
        }

        /* 保留第一关的沉浸式场景底图与滤镜 */
        .viewport {
            position: relative;
            width: 100vw; height: 100vh;
            background: url('https://images.unsplash.com/photo-1518709268805-4e9042af9f23?q=80&w=2000&auto=format&fit=crop') center/cover no-repeat;
            display: flex; justify-content: center; align-items: center;
            filter: contrast(1.15) brightness(0.8);
        }

        .ambient-vignette {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle, rgba(0,0,0,0.2) 20%, rgba(0,0,0,0.95) 100%);
            pointer-events: none; z-index: 1;
        }

        .screen-glow {
            position: absolute; width: 700px; height: 480px;
            background: rgba(0, 255, 102, 0.03);
            border-radius: 50%; filter: blur(100px);
            pointer-events: none; z-index: 2;
            transition: background 1s ease;
        }

        /* CRT 显示屏外壳（维持绿色美学） */
        .crt-frame {
            position: relative; z-index: 10;
            width: 94%; max-width: 760px;
            background: rgba(4, 10, 6, 0.95);
            border: 2px solid var(--dim-green);
            border-radius: 12px; padding: 22px;
            box-shadow: 0 0 60px rgba(0, 0, 0, 0.95), inset 0 0 20px rgba(0, 255, 102, 0.08);
            backdrop-filter: blur(6px);
        }

        /* CRT 扫描线效应 */
        .crt-frame::after {
            content: " "; position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.35) 50%);
            background-size: 100% 4px; pointer-events: none; border-radius: 10px;
        }

        .screen-header {
            display: flex; justify-content: space-between; align-items: center;
            color: var(--green); font-size: 12px;
            border-bottom: 1px solid var(--dim-green);
            padding-bottom: 8px; margin-bottom: 12px;
            letter-spacing: 1px; text-shadow: 0 0 4px var(--green);
        }

        .header-tags span {
            background: rgba(0, 255, 102, 0.1);
            padding: 2px 6px; border-radius: 3px; font-size: 10px; margin-left: 4px;
        }

        /* 频谱/状态示波器 */
        #spectrumCanvas {
            width: 100%; height: 125px;
            background: #010502;
            border: 1px solid var(--dim-green);
            margin-bottom: 12px; display: block;
            border-radius: 4px;
        }

        /* 交互日志区 */
        .terminal-log {
            height: 170px; overflow-y: auto;
            color: var(--green); font-size: 13px; line-height: 1.6;
            word-break: break-all; margin-bottom: 12px;
            text-shadow: 0 0 4px rgba(0, 255, 102, 0.3);
            user-select: text;
            padding-right: 5px;
        }

        .terminal-log::-webkit-scrollbar { width: 4px; }
        .terminal-log::-webkit-scrollbar-thumb { background: var(--dim-green); border-radius: 2px; }

        /* 命令行输入框 */
        .command-bar {
            display: flex; align-items: center;
            background: rgba(0, 0, 0, 0.85);
            border: 1px solid var(--dim-green);
            padding: 10px 12px; border-radius: 4px;
        }

        .prompt { color: var(--green); margin-right: 10px; font-size: 13px; font-weight: bold; }
        .cmd-input {
            background: transparent; border: none; outline: none;
            color: #fff; font-family: inherit; font-size: 13px; flex: 1;
            text-shadow: 0 0 6px var(--green); user-select: text;
        }

        .highlight-cn { color: #fff; font-weight: bold; background: rgba(255,255,255,0.15); padding: 0 4px; border-radius: 2px; }
        .warn-cn { color: var(--amber); font-weight: bold; }
        .success-cn { color: var(--green); font-weight: bold; }
        .danger-cn { color: var(--red); font-weight: bold; }
    </style>
</head>
<body>

<div class="viewport">
    <div class="ambient-vignette"></div>
    <div class="screen-glow" id="screenGlow"></div>

    <div class="crt-frame">
        <div class="screen-header">
            <div>
                <b>地下控制网络 // 4625-SUB-NODE</b>
                <span class="header-tags"><span>内网接入</span><span>解密关卡 II</span></span>
            </div>
            <span id="statusInd" class="success-cn">已连接至目标内网</span>
        </div>

        <canvas id="spectrumCanvas"></canvas>

        <div class="terminal-log" id="logBox">
[授权确认] 验证码 8912 握手成功。正在穿透 4625 kHz 频道背后的加密沙盒...<br>
[剧情交接] 你成功顺着第一关收听到的幽灵电台，反向追踪到了这个被遗弃数十年的地下基站内部终端。<br>
[系统提示] 这里拥有极高的自由探索空间。输入 <span class="highlight-cn">ls</span> 查看服务器内留存的所有档案，找出当年 4625 信号背后的秘密，并尝试寻找安全覆写指令。<br>
----------------------------------------------------------------------
        </div>

        <div class="command-bar">
            <span class="prompt">SUB-NODE:~#</span>
            <input type="text" class="cmd-input" id="cmdInput" autofocus autocomplete="off" spellcheck="false" placeholder="输入 ls 或 help 开始探索...">
        </div>
    </div>
</div>

<script>
    const canvas = document.getElementById('spectrumCanvas');
    const ctx = canvas.getContext('2d');
    const logBox = document.getElementById('logBox');
    const cmdInput = document.getElementById('cmdInput');
    const statusInd = document.getElementById('statusInd');
    const screenGlow = document.getElementById('screenGlow');

    let audioCtx = null, noiseNode = null, noiseGain = null;
    let filesReadCount = 0; // 记录玩家探索了多少文件

    function resize() { canvas.width = canvas.offsetWidth; canvas.height = canvas.offsetHeight; }
    window.addEventListener('resize', resize);
    resize();

    // 🔊 音频合成器（延续第一关的沙沙声与按键声）
    function initAudio() {
        if (audioCtx) return;
        try {
            const AudioContext = window.AudioContext || window.webkitAudioContext;
            audioCtx = new AudioContext();

            const buf = audioCtx.createBuffer(1, audioCtx.sampleRate * 2, audioCtx.sampleRate);
            const data = buf.getChannelData(0);
            for (let i = 0; i < data.length; i++) data[i] = Math.random() * 2 - 1;

            noiseNode = audioCtx.createBufferSource();
            noiseNode.buffer = buf; noiseNode.loop = true;

            noiseGain = audioCtx.createGain();
            noiseGain.gain.value = 0.003; // 轻微内网电流声

            noiseNode.connect(noiseGain);
            noiseGain.connect(audioCtx.destination);
            noiseNode.start();
        } catch(e){}
    }

    function playKeySound() {
        if (!audioCtx) return;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(140 + Math.random() * 60, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.012, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.04);
        osc.connect(gain); gain.connect(audioCtx.destination);
        osc.start(); osc.stop(audioCtx.currentTime + 0.04);
    }

    function playRelaySound() {
        if (!audioCtx) return;
        for (let i = 0; i < 2; i++) {
            setTimeout(() => {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'square';
                osc.frequency.setValueAtTime(500 + Math.random() * 200, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.02, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.04);
                osc.connect(gain); gain.connect(audioCtx.destination);
                osc.start(); osc.stop(audioCtx.currentTime + 0.04);
            }, i * 60);
        }
    }

    // 示波器渲染（平稳内网数据流波形）
    function renderSpectrum() {
        ctx.fillStyle = "rgba(1, 5, 2, 0.22)";
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.strokeStyle = "rgba(0, 255, 102, 0.08)";
        ctx.lineWidth = 1;
        for (let x = 0; x < canvas.width; x += 30) {
            ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke();
        }

        ctx.beginPath();
        ctx.lineWidth = 1.5;
        ctx.strokeStyle = "#00ff66";
        ctx.shadowBlur = 4;
        ctx.shadowColor = "#00ff66";

        const slice = canvas.width / 90;
        let x = 0;

        for (let i = 0; i < 90; i++) {
            let amp = Math.random() * 8 + 2;
            let y = canvas.height / 2 + (Math.random() > 0.5 ? amp : -amp);
            if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
            x += slice;
        }
        ctx.stroke();

        requestAnimationFrame(renderSpectrum);
    }
    renderSpectrum();

    function print(msg, customClass = '') {
        const div = document.createElement('div');
        if (customClass) div.className = customClass;
        div.innerHTML = msg;
        logBox.async = true;
        logBox.appendChild(div);
        logBox.scrollTop = logBox.scrollHeight;
    }

    // 第二关的命令解析引擎（给予玩家充分的自由探索）
    cmdInput.addEventListener('keydown', (e) => {
        initAudio();
        playKeySound();

        if (e.key === 'Enter') {
            const val = cmdInput.value.trim();
            cmdInput.value = '';
            if (!val) return;

            print(`SUB-NODE:~# ${val}`);
            const parts = val.split(' ');
            const cmd = parts[0].toLowerCase();
            const param = parts[1] ? parts[1].toLowerCase() : '';

            // 1. 自由查看目录
            if (cmd === 'ls') {
                playRelaySound();
                print(`【当前目录下的存储文件】:<br>
  - <span class="highlight-cn">project_4625.log</span> （关于第一关幽灵电台的起源报告）<br>
  - <span class="highlight-cn">station_log_1999.txt</span> （地下科研人员留下的绝笔手记）<br>
  - <span class="highlight-cn">security_memo.dat</span> （安全管理条例与系统重置线索）<br>
  - <span class="highlight-cn">emergency_exit.cfg</span> （逃离系统所需的配置说明）`);
            }
            // 2. 自由探索/查阅多个文件 (cat)
            else if (cmd === 'cat') {
                playRelaySound();
                if (param === 'project_4625.log' || param === '4625') {
                    filesReadCount++;
                    print(`【项目 4625 起源报告】<br>当年我们在短波段持续发射无意义的蜂鸣与代号，是为了掩盖地下实验室对某种未知深层电磁波的收容研究。后来，研究员们集体失联，电台却依然在自动循环……`);
                } else if (param === 'station_log_1999.txt' || param === 'station_log') {
                    filesReadCount++;
                    print(`【绝笔手记 - 1999.08.22】<br>“设备失控了。它在通过电波反向读取我们的意识。如果后人通过外部 SDR 终端连进来了，千万不要尝试与它深度绑定。系统内部存在硬编码的安全解脱协议。”`);
                } else if (param === 'security_memo.dat' || param === 'security_memo') {
                    filesReadCount++;
                    print(`【安全管理条例】<br>系统紧急重置命令格式为：<span class="highlight-cn">override [主密钥]</span>。<br>主密钥的前半部分是当年基站代号 <span class="highlight-cn">OMEGA</span>，后半部分可在逃离配置文件中找到。`);
                } else if (param === 'emergency_exit.cfg' || param === 'emergency_exit') {
                    filesReadCount++;
                    print(`【紧急出口配置】<br>配置参数载入：安全网关重置密钥尾缀已确认：<span class="highlight-cn">-9982</span>。<br>（提示：你可以尝试输入 override OMEGA-9982 来执行最终系统剥离）`);
                } else {
                    print(`[错误] 找不到该文件。请先输入 <span class="highlight-cn">ls</span> 查看可用文件列表。`, 'danger-cn');
                }
            }
            // 3. 终极覆写/解谜通关 (override)
            else if (cmd === 'override') {
                if (param === 'omega-9982' || param === 'OMEGA-9982') {
                    playRelaySound();
                    print(`[系统内核] 收到最高覆写指令：OMEGA-9982。`, 'success-cn');
                    print(`[底层重构] 正在格式化本地沙盒，断开与 4625 频道的量子缠绕……`, 'success-cn');
                    print(`[通关提示] 恭喜你成功解开第二关！即将进入下一阶段（或通关结局）！`, 'success-cn');
                    
                    document.body.style.boxShadow = "inset 0 0 120px #00ff66";
                    setTimeout(() => {
                        alert("【第二关解密成功】你已彻底关闭了地下终端的意识循环，成功脱离险境！");
                        // 可以在此跳转到第三关：window.location.href = 'stage3.html';
                    }, 1800);
                } else {
                    print(`[拒绝执行] 密钥不匹配！请先通过 <span class="highlight-cn">ls</span> 和 <span class="highlight-cn">cat</span> 充分探索服务器内的所有档案文件以凑齐密钥。`, 'danger-cn');
                }
            }
            // 常用帮助
            else if (cmd === 'help') {
                print(`【第二关探索指南】:<br>
  • <span class="highlight-cn">ls</span> - 探索并列出服务器中留存的所有档案文件<br>
  • <span class="highlight-cn">cat [文件名]</span> - 自由阅读指定文件的剧情与线索（如 cat project_4625.log）<br>
  • <span class="highlight-cn">override [密钥]</span> - 拼凑线索并输入最终覆写指令以通关（例：override OMEGA-xxxx）<br>
  • <span class="highlight-cn">clear</span> - 清理屏幕`);
            }
            else if (cmd === 'clear') { logBox.innerHTML = ''; }
            else { print(`未识别的指令: ${cmd}。输入 <span class="highlight-cn">help</span> 查看探索指南。`, 'danger-cn'); }
        }
    });

    document.addEventListener('click', () => cmdInput.focus());
</script>

</body>
</html>
