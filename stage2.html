<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SDR-NODE // 深层意识隔离区 (SECTOR-OMEGA)</title>
    <style>
        :root {
            --green: #00ff66;
            --amber: #ffaa00;
            --red: #ff3333;
            --cyan: #00e5ff;
            --dim-green: rgba(0, 255, 102, 0.2);
            --dim-red: rgba(255, 51, 51, 0.2);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }

        body, html {
            width: 100%; height: 100%;
            background: #020402;
            font-family: 'Courier New', 'Microsoft YaHei', sans-serif;
            overflow: hidden;
        }

        /* 工业废墟、深渊机械机房恐怖底图 */
        .viewport {
            position: relative;
            width: 100vw; height: 100vh;
            background: url('https://images.unsplash.com/photo-1518770660439-4636190af475?q=80&w=2000&auto=format&fit=crop') center/cover no-repeat;
            display: flex; justify-content: center; align-items: center;
            filter: contrast(1.35) brightness(0.4) saturate(1.6);
            transition: filter 1s ease;
        }

        .ambient-vignette {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle, rgba(0,25,8,0.1) 10%, rgba(0,0,0,0.99) 85%);
            pointer-events: none; z-index: 1;
        }

        .screen-glow {
            position: absolute; width: 700px; height: 480px;
            background: rgba(0, 255, 102, 0.04);
            border-radius: 50%; filter: blur(110px);
            pointer-events: none; z-index: 2;
            transition: background 1s ease;
        }

        /* CRT 显示屏外壳 */
        .crt-frame {
            position: relative; z-index: 10;
            width: 94%; max-width: 760px;
            background: rgba(2, 8, 4, 0.96);
            border: 2px solid var(--dim-green);
            border-radius: 12px; padding: 22px;
            box-shadow: 0 0 60px rgba(0, 0, 0, 0.98), inset 0 0 25px rgba(0, 255, 102, 0.06);
            backdrop-filter: blur(8px);
        }

        /* CRT 扫描线效应 */
        .crt-frame::after {
            content: " "; position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.4) 50%);
            background-size: 100% 4px; pointer-events: none; border-radius: 10px;
        }

        .screen-header {
            display: flex; justify-content: space-between; align-items: center;
            color: var(--green); font-size: 12px;
            border-bottom: 1px solid var(--dim-green);
            padding-bottom: 8px; margin-bottom: 12px;
            letter-spacing: 1px; text-shadow: 0 0 4px var(--green);
        }

        .header-tags span {
            background: rgba(0, 255, 102, 0.1);
            padding: 2px 6px; border-radius: 3px; font-size: 10px; margin-left: 4px;
        }

        /* 动态波形示波器 */
        #spectrumCanvas {
            width: 100%; height: 120px;
            background: #010401;
            border: 1px solid var(--dim-green);
            margin-bottom: 12px; display: block;
            border-radius: 4px;
        }

        /* 交互日志区 */
        .terminal-log {
            height: 175px; overflow-y: auto;
            color: var(--green); font-size: 13px; line-height: 1.6;
            word-break: break-all; margin-bottom: 12px;
            text-shadow: 0 0 4px rgba(0, 255, 102, 0.3);
            user-select: text;
            padding-right: 5px;
        }

        .terminal-log::-webkit-scrollbar { width: 4px; }
        .terminal-log::-webkit-scrollbar-thumb { background: var(--dim-green); border-radius: 2px; }

        /* 命令行输入框 */
        .command-bar {
            display: flex; align-items: center;
            background: rgba(0, 0, 0, 0.85);
            border: 1px solid var(--dim-green);
            padding: 10px 12px; border-radius: 4px;
        }

        .prompt { color: var(--green); margin-right: 10px; font-size: 13px; font-weight: bold; }
        .cmd-input {
            background: transparent; border: none; outline: none;
            color: #fff; font-family: inherit; font-size: 13px; flex: 1;
            text-shadow: 0 0 6px var(--green); user-select: text;
        }

        .highlight-cn { color: #fff; font-weight: bold; background: rgba(255,255,255,0.15); padding: 0 4px; border-radius: 2px; }
        .warn-cn { color: var(--amber); font-weight: bold; }
        .success-cn { color: var(--green); font-weight: bold; }
        .danger-cn { color: var(--red); font-weight: bold; text-shadow: 0 0 6px var(--red); }
        .glitch-text { color: var(--red); animation: flicker 0.12s infinite; }

        @keyframes flicker {
            0% { opacity: 0.7; }
            50% { opacity: 1; }
            100% { opacity: 0.85; }
        }
    </style>
</head>
<body>

<div class="viewport" id="viewportBg">
    <div class="ambient-vignette"></div>
    <div class="screen-glow" id="screenGlow"></div>

    <div class="crt-frame" id="crtFrame">
        <div class="screen-header">
            <div>
                <b>地下核心沙盒 // SECTOR-OMEGA</b>
                <span class="header-tags"><span>内网连结</span><span>状态: 异常监测</span></span>
            </div>
            <span id="statusInd" class="warn-cn">生物电磁场锁定中</span>
        </div>

        <canvas id="spectrumCanvas"></canvas>

        <div class="terminal-log" id="logBox">
[安全网关] 授权代码 8912 验证通过。已穿透 4625 频道外围防火墙。<br>
[剧情背景] 第一关接收到的幽灵电台，实际上是这座废弃地下科研所数十年前遗留的“自动广播网”。而你现在接入的，正是当年引发失联事件的**核心本地终端**。<br>
[系统提示] 服务器内分为公开浅层档案与高强度加密的深层禁区。输入 <span class="highlight-cn">ls</span> 开始检索……<br>
----------------------------------------------------------------------
        </div>

        <div class="command-bar">
            <span class="prompt">OMEGA:~#</span>
            <input type="text" class="cmd-input" id="cmdInput" autofocus autocomplete="off" spellcheck="false" placeholder="输入 ls 查看文件...">
        </div>
    </div>
</div>

<script>
    const canvas = document.getElementById('spectrumCanvas');
    const ctx = canvas.getContext('2d');
    const logBox = document.getElementById('logBox');
    const cmdInput = document.getElementById('cmdInput');
    const statusInd = document.getElementById('statusInd');
    const screenGlow = document.getElementById('screenGlow');
    const crtFrame = document.getElementById('crtFrame');
    const viewportBg = document.getElementById('viewportBg');

    let audioCtx = null, noiseNode = null, noiseGain = null;
    let deepUnlocked = false; // 是否破解了深层锁
    let calibrationDone = false; // 全新解密玩法：波形谐振校准状态

    function resize() { canvas.width = canvas.offsetWidth; canvas.height = canvas.offsetHeight; }
    window.addEventListener('resize', resize);
    resize();

    // 🔊 诡异低频与环境音效
    function initAudio() {
        if (audioCtx) return;
        try {
            const AudioContext = window.AudioContext || window.webkitAudioContext;
            audioCtx = new AudioContext();

            const buf = audioCtx.createBuffer(1, audioCtx.sampleRate * 2, audioCtx.sampleRate);
            const data = buf.getChannelData(0);
            for (let i = 0; i < data.length; i++) data[i] = (Math.random() * 2 - 1) * 0.25;

            noiseNode = audioCtx.createBufferSource();
            noiseNode.buffer = buf; noiseNode.loop = true;

            noiseGain = audioCtx.createGain();
            noiseGain.gain.value = 0.005;

            noiseNode.connect(noiseGain);
            noiseGain.connect(audioCtx.destination);
            noiseNode.start();
        } catch(e){}
    }

    function playKeySound() {
        if (!audioCtx) return;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(90 + Math.random() * 40, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.012, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.05);
        osc.connect(gain); gain.connect(audioCtx.destination);
        osc.start(); osc.stop(audioCtx.currentTime + 0.05);
    }

    function playHorrorAlarm() {
        if (!audioCtx) return;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(300, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(80, audioCtx.currentTime + 0.6);
        gain.gain.setValueAtTime(0.04, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.6);
        osc.connect(gain); gain.connect(audioCtx.destination);
        osc.start(); osc.stop(audioCtx.currentTime + 0.6);
    }

    // 动态波形渲染
    function renderSpectrum() {
        ctx.fillStyle = "rgba(1, 4, 1, 0.25)";
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.strokeStyle = "rgba(0, 255, 102, 0.07)";
        ctx.lineWidth = 1;
        for (let x = 0; x < canvas.width; x += 30) {
            ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke();
        }

        ctx.beginPath();
        ctx.lineWidth = 1.6;
        ctx.strokeStyle = deepUnlocked ? "#ff3333" : "#00ff66";
        ctx.shadowBlur = deepUnlocked ? 10 : 4;
        ctx.shadowColor = deepUnlocked ? "#ff3333" : "#00ff66";

        const slice = canvas.width / 90;
        let x = 0;

        for (let i = 0; i < 90; i++) {
            let amp = Math.random() * 6 + 2;
            if (deepUnlocked && i > 38 && i < 52) {
                amp = Math.sin(i * 0.5) * 40; // 恐怖心跳突波
            }
            let y = canvas.height / 2 + (Math.random() > 0.5 ? amp : -amp);
            if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
            x += slice;
        }
        ctx.stroke();

        requestAnimationFrame(renderSpectrum);
    }
    renderSpectrum();

    function print(msg, customClass = '') {
        const div = document.createElement('div');
        if (customClass) div.className = customClass;
        div.innerHTML = msg;
        logBox.appendChild(div);
        logBox.scrollTop = logBox.scrollHeight;
    }

    // 交互引擎
    cmdInput.addEventListener('keydown', (e) => {
        initAudio();
        playKeySound();

        if (e.key === 'Enter') {
            const val = cmdInput.value.trim();
            cmdInput.value = '';
            if (!val) return;

            print(`OMEGA:~# ${val}`);
            const parts = val.split(' ');
            const cmd = parts[0].toLowerCase();
            const param = parts[1] ? parts[1].toLowerCase() : '';

            // 1. 列表查看（多份浅层档案 + 深层加密档案）
            if (cmd === 'ls') {
                print(`【服务器当前挂载卷宗】:<br>
  [浅层公开] <span class="highlight-cn">station_history.txt</span> （4625 频道起源与地下所背景）<br>
  [浅层公开] <span class="highlight-cn">staff_memo_1999.log</span> （失联前夕员工的恐慌备忘录）<br>
  [浅层公开] <span class="highlight-cn">resonance_manual.txt</span> （硬件波形谐振校准操作手册）<br>
  [深层加密] <span class="danger-cn">subject_zero_core.dat [LOCKED]</span> （零号实体收容记录 - 需谐振校准后访问）<br>
  [深层加密] <span class="danger-cn">emergency_override.cfg [LOCKED]</span> （终极系统覆写配置 - 需解密）`);
            }
            // 2. 查看浅层/深层文件
            else if (cmd === 'cat') {
                if (param === 'station_history.txt' || param === 'station_history') {
                    print(`【4625 频道背景说明】<br>“蜂鸣电台”不仅是一个代号。当年我们在地下深处挖掘时，意外接触到了一种非物质的“硅基电磁实体”。为了将其隔绝，研究所启动了全频段噪音掩盖计划。`);
                } else if (param === 'staff_memo_1999.log' || param === 'staff_memo') {
                    print(`【员工恐慌备忘录】<br>“它开始在显示屏上说话了。它模仿我们每个人的声音。如果你想打开更深处的禁区档案，必须先通过 <span class="highlight-cn">resonance_manual.txt</span> 了解如何校准硬件波形（谐振频率为 <span class="highlight-cn">1420</span>）。”`);
                } else if (param === 'resonance_manual.txt' || param === 'resonance_manual') {
                    print(`【谐振校准手册】<br>“防火墙由量子谐振锁保护。请在终端执行：<span class="highlight-cn">calibrate [4位谐振数值]</span> 来对齐波形。手册提示核心数值对应宇宙中最神秘的氢线频率前缀：<span class="highlight-cn">1420</span>。”`);
                } else if (param === 'subject_zero_core.dat' || param === 'emergency_override.cfg') {
                    if (!deepUnlocked) {
                        print(`[访问拒绝] 该文件处于量子加密隔离状态！请先阅读 <span class="highlight-cn">resonance_manual.txt</span>，并在终端输入 <span class="highlight-cn">calibrate 1420</span> 完成全新解密玩法！`, 'danger-cn');
                    } else {
                        if (param.includes('subject')) {
                            print(`【零号实体收容记录】<br><span class="glitch-text">[警告：精神污染]</span> “它已经顺着你的网卡爬上来了。你以为你在解密游戏？不，它正在借你的眼睛看着屏幕外的房间……”`, 'danger-cn');
                        } else {
                            print(`【终极系统覆写配置】<br>“若要彻底格式化此节点并阻断实体的入侵，必须输入最终覆写指令：<span class="highlight-cn">override VOID-9982</span>。”`, 'warn-cn');
                        }
                    }
                } else {
                    print(`[错误] 找不到该文件。输入 <span class="highlight-cn">ls</span> 查看全部卷宗。`, 'danger-cn');
                }
            }
            // 3. 全新解密玩法：波形谐振校准 (calibrate)
            else if (cmd === 'calibrate') {
                if (param === '1420') {
                    deepUnlocked = true;
                    calibrationDone = true;
                    playHorrorAlarm();
                    statusInd.innerText = "警告：深层锁已破开 / 实体觉醒";
                    statusInd.className = "danger-cn";
                    screenGlow.style.background = "rgba(255, 51, 51, 0.1)";
                    crtFrame.style.borderColor = "var(--dim-red)";
                    viewportBg.style.filter = "contrast(1.4) brightness(0.35) saturate(2)";

                    print(`[谐振校准成功] 物理波形对齐！量子锁已强制崩解！`, 'success-cn');
                    print(`[极度危险] 深层加密文件 <span class="danger-cn">subject_zero_core.dat</span> 与 <span class="danger-cn">emergency_override.cfg</span> 已强制解除锁定！`, 'danger-cn');
                    print(`[诡异提示] 终端灯光由绿转红……请立刻用 <span class="highlight-cn">cat</span> 阅读深层档案并寻找逃生代码！`);
                } else {
                    print(`[校准失败] 谐振频率不匹配！波形剧烈撕裂！请仔细阅读 <span class="highlight-cn">resonance_manual.txt</span> 寻找正确的 4 位校准数值。`, 'danger-cn');
                }
            }
            // 4. 终极覆写通关 (override)
            else if (cmd === 'override') {
                if (param === 'void-9982' || param === 'VOID-9982') {
                    playHorrorAlarm();
                    print(`[核心内核] 收到终极覆写指令：VOID-9982。`, 'success-cn');
                    print(`[系统清空] 正在彻底格式化本地扇区，切断与实体的意识量子纠缠……`, 'success-cn');
                    print(`[通关成功] 终端断电。你成功逃离了深层恐怖的意识陷阱！`, 'success-cn');

                    document.body.style.boxShadow = "inset 0 0 160px #ff3333";
                    setTimeout(() => {
                        alert("【第二关完美通关】你成功破开深层机密并执行了覆写，回归现实世界！");
                        // 预留跳转第三关：window.location.href = 'stage3.html';
                    }, 2000);
                } else {
                    print(`[拒绝执行] 覆写代码不正确！请先解锁深层文件（cat emergency_override.cfg）获取完整代码。`, 'danger-cn');
                }
            }
            // 帮助
            else if (cmd === 'help') {
                print(`【SECTOR-OMEGA 终端指令指南】:<br>
  • <span class="highlight-cn">ls</span> - 列出所有浅层与深层服务器档案<br>
  • <span class="highlight-cn">cat [文件名]</span> - 阅读文件了解剧情与线索<br>
  • <span class="highlight-cn">calibrate [数值]</span> - <span class="warn-cn">[全新解密玩法]</span> 输入谐振频率破开深层加密锁<br>
  • <span class="highlight-cn">override [终极代码]</span> - 在深层档案中找到代码后执行系统通关覆写<br>
  • <span class="highlight-cn">clear</span> - 清理屏幕`);
            }
            else if (cmd === 'clear') { logBox.innerHTML = ''; }
            else { print(`未识别的指令: ${cmd}。输入 <span class="highlight-cn">help</span> 获取帮助。`, 'danger-cn'); }
        }
    });

    document.addEventListener('click', () => cmdInput.focus());
</script>

</body>
</html>
