<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SDR-NODE // 深度隔离内网 (SECTOR-OMEGA)</title>
    <style>
        :root {
            --green: #00ff66;
            --amber: #ffaa00;
            --red: #ff3333;
            --cyan: #00e5ff;
            --dim-green: rgba(0, 255, 102, 0.2);
            --dim-red: rgba(255, 51, 51, 0.2);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }

        body, html {
            width: 100%; height: 100%;
            background: #020402;
            font-family: 'Courier New', 'Microsoft YaHei', sans-serif;
            overflow: hidden;
        }

        /* 工业废墟、深渊机械机房恐怖底图 */
        .viewport {
            position: relative;
            width: 100vw; height: 100vh;
            background: url('https://images.unsplash.com/photo-1518770660439-4636190af475?q=80&w=2000&auto=format&fit=crop') center/cover no-repeat;
            display: flex; justify-content: center; align-items: center;
            filter: contrast(1.35) brightness(0.4) saturate(1.6);
            transition: filter 1s ease;
        }

        .ambient-vignette {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle, rgba(0,25,8,0.1) 10%, rgba(0,0,0,0.99) 85%);
            pointer-events: none; z-index: 1;
        }

        .screen-glow {
            position: absolute; width: 700px; height: 480px;
            background: rgba(0, 255, 102, 0.04);
            border-radius: 50%; filter: blur(110px);
            pointer-events: none; z-index: 2;
            transition: background 1s ease;
        }

        /* CRT 显示屏外壳 */
        .crt-frame {
            position: relative; z-index: 10;
            width: 94%; max-width: 760px;
            background: rgba(2, 8, 4, 0.96);
            border: 2px solid var(--dim-green);
            border-radius: 12px; padding: 22px;
            box-shadow: 0 0 60px rgba(0, 0, 0, 0.98), inset 0 0 25px rgba(0, 255, 102, 0.06);
            backdrop-filter: blur(8px);
            transition: border-color 1s ease;
        }

        /* CRT 扫描线效应 */
        .crt-frame::after {
            content: " "; position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.4) 50%);
            background-size: 100% 4px; pointer-events: none; border-radius: 10px;
        }

        .screen-header {
            display: flex; justify-content: space-between; align-items: center;
            color: var(--green); font-size: 12px;
            border-bottom: 1px solid var(--dim-green);
            padding-bottom: 8px; margin-bottom: 12px;
            letter-spacing: 1px; text-shadow: 0 0 4px var(--green);
        }

        .header-tags span {
            background: rgba(0, 255, 102, 0.1);
            padding: 2px 6px; border-radius: 3px; font-size: 10px; margin-left: 4px;
        }

        /* 动态波形示波器 */
        #spectrumCanvas {
            width: 100%; height: 120px;
            background: #010401;
            border: 1px solid var(--dim-green);
            margin-bottom: 12px; display: block;
            border-radius: 4px;
        }

        /* 交互日志区 */
        .terminal-log {
            height: 175px; overflow-y: auto;
            color: var(--green); font-size: 13px; line-height: 1.6;
            word-break: break-all; margin-bottom: 12px;
            text-shadow: 0 0 4px rgba(0, 255, 102, 0.3);
            user-select: text;
            padding-right: 5px;
        }

        .terminal-log::-webkit-scrollbar { width: 4px; }
        .terminal-log::-webkit-scrollbar-thumb { background: var(--dim-green); border-radius: 2px; }

        /* 命令行输入框 */
        .command-bar {
            display: flex; align-items: center;
            background: rgba(0, 0, 0, 0.85);
            border: 1px solid var(--dim-green);
            padding: 10px 12px; border-radius: 4px;
        }

        .prompt { color: var(--green); margin-right: 10px; font-size: 13px; font-weight: bold; }
        .cmd-input {
            background: transparent; border: none; outline: none;
            color: #fff; font-family: inherit; font-size: 13px; flex: 1;
            text-shadow: 0 0 6px var(--green); user-select: text;
        }

        .highlight-cn { color: #fff; font-weight: bold; background: rgba(255,255,255,0.15); padding: 0 4px; border-radius: 2px; }
        .warn-cn { color: var(--amber); font-weight: bold; }
        .success-cn { color: var(--green); font-weight: bold; }
        .danger-cn { color: var(--red); font-weight: bold; text-shadow: 0 0 6px var(--red); }
        .glitch-text { color: var(--red); animation: flicker 0.12s infinite; }

        @keyframes flicker {
            0% { opacity: 0.7; }
            50% { opacity: 1; }
            100% { opacity: 0.85; }
        }
    </style>
</head>
<body>

<div class="viewport" id="viewportBg">
    <div class="ambient-vignette"></div>
    <div class="screen-glow" id="screenGlow"></div>

    <div class="crt-frame" id="crtFrame">
        <div class="screen-header">
            <div>
                <b>地下核心沙盒 // SECTOR-OMEGA</b>
                <span class="header-tags"><span>内网连结</span><span>状态: 稳定</span></span>
            </div>
            <span id="statusInd" class="warn-cn">表面层挂载中</span>
        </div>

        <canvas id="spectrumCanvas"></canvas>

        <div class="terminal-log" id="logBox">
[安全网关] 验证码 8912 握手成功。已穿透 4625 频道外围防火墙。<br>
[剧情交接] 你顺着第一关的短波幽灵电台，成功连入了这座废弃地下所的本地终端。服务器目前处于**浅层目录**。<br>
[系统提示] 输入 <span class="highlight-cn">ls</span> 查阅表面公开档案，寻找通往深层的线索……<br>
----------------------------------------------------------------------
        </div>

        <div class="command-bar">
            <span class="prompt">OMEGA:~#</span>
            <input type="text" class="cmd-input" id="cmdInput" autofocus autocomplete="off" spellcheck="false" placeholder="输入 ls 查看文件...">
        </div>
    </div>
</div>

<script>
    const canvas = document.getElementById('spectrumCanvas');
    const ctx = canvas.getContext('2d');
    const logBox = document.getElementById('logBox');
    const cmdInput = document.getElementById('cmdInput');
    const statusInd = document.getElementById('statusInd');
    const screenGlow = document.getElementById('screenGlow');
    const crtFrame = document.getElementById('crtFrame');
    const viewportBg = document.getElementById('viewportBg');

    let audioCtx = null, noiseNode = null, noiseGain = null;
    let accessLayer = 1; // 1: 浅层, 2: 中层(指针注入解密后), 3: 深层核心(终极覆写后)

    function resize() { canvas.width = canvas.offsetWidth; canvas.height = canvas.offsetHeight; }
    window.addEventListener('resize', resize);
    resize();

    // 🔊 绝对稳定的 WebAudio 合成器（环境沙沙声 + 按键音 + 恐怖警报）
    function initAudio() {
        if (audioCtx) return;
        try {
            const AudioContext = window.AudioContext || window.webkitAudioContext;
            audioCtx = new AudioContext();

            const buf = audioCtx.createBuffer(1, audioCtx.sampleRate * 2, audioCtx.sampleRate);
            const data = buf.getChannelData(0);
            for (let i = 0; i < data.length; i++) data[i] = (Math.random() * 2 - 1) * 0.2;

            noiseNode = audioCtx.createBufferSource();
            noiseNode.buffer = buf; noiseNode.loop = true;

            noiseGain = audioCtx.createGain();
            noiseGain.gain.value = 0.004;

            noiseNode.connect(noiseGain);
            noiseGain.connect(audioCtx.destination);
            noiseNode.start();
        } catch(e){}
    }

    function playKeySound() {
        if (!audioCtx) return;
        try {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(150 + Math.random() * 80, audioCtx.currentTime);
            gain.gain.setValueAtTime(0.015, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.04);
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.start(); osc.stop(audioCtx.currentTime + 0.04);
        } catch(e){}
    }

    function playRelaySound() {
        if (!audioCtx) return;
        try {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'square';
            osc.frequency.setValueAtTime(450, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(150, audioCtx.currentTime + 0.08);
            gain.gain.setValueAtTime(0.03, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.08);
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.start(); osc.stop(audioCtx.currentTime + 0.08);
        } catch(e){}
    }

    function playHorrorAlarm() {
        if (!audioCtx) return;
        try {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(220, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(60, audioCtx.currentTime + 0.5);
            gain.gain.setValueAtTime(0.04, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.5);
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.start(); osc.stop(audioCtx.currentTime + 0.5);
        } catch(e){}
    }

    // 动态示波器渲染
    function renderSpectrum() {
        ctx.fillStyle = "rgba(1, 4, 1, 0.25)";
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.strokeStyle = "rgba(0, 255, 102, 0.07)";
        ctx.lineWidth = 1;
        for (let x = 0; x < canvas.width; x += 30) {
            ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke();
        }

        ctx.beginPath();
        ctx.lineWidth = 1.6;
        ctx.strokeStyle = accessLayer >= 2 ? "#ff3333" : "#00ff66";
        ctx.shadowBlur = accessLayer >= 2 ? 10 : 4;
        ctx.shadowColor = accessLayer >= 2 ? "#ff3333" : "#00ff66";

        const slice = canvas.width / 90;
        let x = 0;

        for (let i = 0; i < 90; i++) {
            let amp = Math.random() * 6 + 2;
            if (accessLayer >= 2 && i > 38 && i < 52) {
                amp = Math.sin(i * 0.5) * 42; // 恐怖心跳突波
            }
            let y = canvas.height / 2 + (Math.random() > 0.5 ? amp : -amp);
            if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
            x += slice;
        }
        ctx.stroke();

        requestAnimationFrame(renderSpectrum);
    }
    renderSpectrum();

    function print(msg, customClass = '') {
        const div = document.createElement('div');
        if (customClass) div.className = customClass;
        div.innerHTML = msg;
        logBox.appendChild(div);
        logBox.scrollTop = logBox.scrollHeight;
    }

    // 命令行交互核心
    cmdInput.addEventListener('keydown', (e) => {
        initAudio();
        playKeySound();

        if (e.key === 'Enter') {
            const val = cmdInput.value.trim();
            cmdInput.value = '';
            if (!val) return;

            print(`OMEGA:~# ${val}`);
            const parts = val.split(' ');
            const cmd = parts[0].toLowerCase();
            const param = parts[1] ? parts[1].toLowerCase() : '';

            // 1. 动态文件列表（层层递进，绝不一开始就全部暴露）
            if (cmd === 'ls') {
                playRelaySound();
                if (accessLayer === 1) {
                    print(`【浅层公开卷宗】:<br>
  - <span class="highlight-cn">station_history.txt</span> （4625 频道起源与地下所背景）<br>
  - <span class="highlight-cn">staff_memo_1999.log</span> （失联前夕员工留下的恐慌手记）<br>
  - <span class="highlight-cn">kernel_debug.txt</span> （系统内核底层调试说明与内存指针提示）`);
                } else if (accessLayer === 2) {
                    print(`【中层隔离档案 // 已通过内存指针注入解锁】:<br>
  - <span class="warn-cn">containment_breach.dat</span> （收容失控实录 - 诡异档案）<br>
  - <span class="warn-cn">override_protocol.cfg</span> （终极系统覆写配置说明）`);
                } else {
                    print(`【核心禁区 // 最终解密已激活】:<br>
  - <span class="danger-cn">subject_zero_soul.log</span> （零号实体意识残留）<br>
  - <span class="danger-cn">destruct_sequence.exe</span> （终极格式化与通关指令）`);
                }
            }
            // 2. 查看文件
            else if (cmd === 'cat') {
                playRelaySound();
                if (param === 'station_history.txt' || param === 'station_history') {
                    print(`【4625 频道背景】<br>当年的幽灵电台不单是自动广播，它是人类试图对未知“硅基电磁迷因”进行单向封锁的物理防线。`);
                } else if (param === 'staff_memo_1999.log' || param === 'staff_memo') {
                    print(`【1999 员工手记】<br>“它在监控我们。控制台的内存段里藏着主板总线漏洞。要想跳过防火墙进入中层，必须使用内存指针注入指令：<span class="highlight-cn">patch [内存地址代号]</span>。”`);
                } else if (param === 'kernel_debug.txt' || param === 'kernel_debug') {
                    print(`【内核调试说明】<br>“系统主板内存偏移量检测中……有效的高位注入指针代号为十六进制：<span class="highlight-cn">0x4F</span>。请尝试在终端输入：<span class="highlight-cn">patch 0x4f</span>。”`);
                } 
                // 中层文件
                else if ((param === 'containment_breach.dat' || param === 'override_protocol.cfg') && accessLayer >= 2) {
                    if (param.includes('containment')) {
                        print(`【收容失控实录】<br><span class="glitch-text">[警告]</span> “研究员在连入本地终端后，身体在现实中消失了，意识却被永久锁在了服务器底座里。现在，屏幕前的你就是它的下一个寄宿体……”`);
                    } else {
                        print(`【覆写配置说明】<br>“若要执行终极格式化，必须先触发最终解密玩法。请向系统发送底层比特对齐指令：<span class="highlight-cn">align [安全校验码]</span>（校验码可在深层内核中找到）。”`);
                        accessLayer = 3; // 推进到最终层解锁
                    }
                } 
                // 终极核心文件
                else if ((param === 'subject_zero_soul.log' || param === 'destruct_sequence.exe') && accessLayer >= 3) {
                    print(`【零号实体意识残留 / 终极指令】<br>“安全校验码已在底层生成：<span class="danger-cn">9982</span>。请立刻输入：<span class="highlight-cn">override VOID-9982</span> 格式化此地，否则你将永远离不开这里！”`, 'danger-cn');
                } else {
                    print(`[错误] 文件不存在，或者当前权限不足以访问该深层卷宗。请先输入 <span class="highlight-cn">ls</span> 查看可见层级。`, 'danger-cn');
                }
            }
            // 3. 全新解密玩法一：内存指针注入 (patch) -> 突破到中层
            else if (cmd === 'patch') {
                if (param === '0x4f' || param === '4f') {
                    accessLayer = 2;
                    playHorrorAlarm();
                    statusInd.innerText = "警告：中层防线已破开";
                    statusInd.className = "danger-cn";
                    screenGlow.style.background = "rgba(255, 51, 51, 0.08)";
                    crtFrame.style.borderColor = "var(--dim-red)";
                    viewportBg.style.filter = "contrast(1.4) brightness(0.35) saturate(1.8)";

                    print(`[内存注入成功] 指针 0x4F 写入内核生效！中层隔离沙盒已被强行剥离！`, 'success-cn');
                    print(`[系统提示] 新的机密文件已解密掉落！请再次输入 <span class="highlight-cn">ls</span> 查看中层档案。`, 'warn-cn');
                } else {
                    print(`[注入失败] 内存地址错误！系统触发防御反击！请阅读 <span class="highlight-cn">kernel_debug.txt</span> 获取正确的十六进制指针。`, 'danger-cn');
                }
            }
            // 4. 全新解密玩法二：比特对齐校验 (align) -> 确认最终通关代码
            else if (cmd === 'align') {
                if (param === '9982') {
                    playHorrorAlarm();
                    print(`[比特对齐成功] 量子校验完成！终极覆写指令已完全激活：<span class="success-cn">override VOID-9982</span>`, 'success-cn');
                    print(`[最后通牒] 请立刻在终端输入：<span class="highlight-cn">override VOID-9982</span> 执行格式化逃生！`, 'warn-cn');
                } else {
                    print(`[校验失败] 校验数值不匹配！请先通过 <span class="highlight-cn">cat override_protocol.cfg</span> 获取正确的比特对齐码。`, 'danger-cn');
                }
            }
            // 5. 终极覆写通关 (override)
            else if (cmd === 'override') {
                if (param === 'void-9982' || param === 'VOID-9982') {
                    playHorrorAlarm();
                    print(`[内核销毁] 收到终极覆写指令：VOID-9982。`, 'success-cn');
                    print(`[格式化中] 正在彻底清除本地数据磁道，切断与地下实体的量子缠绕……`, 'success-cn');
                    print(`[通关成功] 意识链接已强行断开。欢迎回到现实世界！`, 'success-cn');

                    document.body.style.boxShadow = "inset 0 0 160px #ff3333";
                    setTimeout(() => {
                        alert("【第二关完美通关】你通过内存指针注入与比特对齐，成功粉碎了深层意识陷阱！");
                        // 预留跳转第三关：window.location.href = 'stage3.html';
                    }, 2000);
                } else {
                    print(`[拒绝执行] 覆写代码不正确！请先完成前置的解密与对齐步骤。`, 'danger-cn');
                }
            }
            // 帮助
            else if (cmd === 'help') {
                print(`【SECTOR-OMEGA 终端高级指令指南】:<br>
  • <span class="highlight-cn">ls</span> - 动态查看当前权限层级下的服务器文件<br>
  • <span class="highlight-cn">cat [文件名]</span> - 阅读文件获取剧情与解密线索<br>
  • <span class="highlight-cn">patch [十六进制指针]</span> - <span class="warn-cn">[解密玩法1]</span> 注入内存指针以破开中层沙盒（例：patch 0x4f）<br>
  • <span class="highlight-cn">align [校验码]</span> - <span class="warn-cn">[解密玩法2]</span> 进行比特对齐校验获取终极指令<br>
  • <span class="highlight-cn">override [终极代码]</span> - 执行终极格式化通关（例：override VOID-xxxx）<br>
  • <span class="highlight-cn">clear</span> - 清理屏幕`);
            }
            else if (cmd === 'clear') { logBox.innerHTML = ''; }
            else { print(`未识别的指令: ${cmd}。输入 <span class="highlight-cn">help</span> 获取帮助。`, 'danger-cn'); }
        }
    });

    document.addEventListener('click', () => cmdInput.focus());
</script>

</body>
</html>
